name: formalize
version: 1.0.0
description: Draft and QSL-check a formalization proposal for one requirement.
initialPhase: drafting
phases:
  - {name: drafting}
  - {name: checked}
  - {name: analysed}
  - {name: awaiting_approval}
  - {name: approved, terminal: true}
  - {name: rejected, terminal: true}
  - {name: stopped, terminal: true}
transitions:
  - from: drafting
    to: checked
    invariants: ["interview.complete:request", qsl_check_passes]
    defaultGate: auto
  - from: checked
    to: drafting
    defaultGate: auto
  - from: checked
    to: analysed
    defaultGate: auto
  - from: analysed
    to: drafting
    defaultGate: auto
  - from: analysed
    to: awaiting_approval
    invariants: [analysis_consistent_with_approved]
    defaultGate: auto
  - from: awaiting_approval
    to: approved
    invariants: [formal_rule_approved]
    defaultGate: hitl
  - from: awaiting_approval
    to: rejected
    defaultGate: hitl
  - from: drafting
    to: stopped
    invariants: [formalization_retries_exhausted]
    defaultGate: auto
itemSchemas:
  quoin_context: {}
  formalization_request:
    required: [requirement_id, draft_path, engineering_assurance, allowed_signers]
    properties:
      requirement_id: {type: string}
      draft_path: {type: string}
      engineering_assurance: {type: string}
      allowed_signers: {type: string}
      gitsign:
        type: object
        required: [certificate_identity, certificate_oidc_issuer, principal]
        properties:
          certificate_identity: {type: string}
          certificate_oidc_issuer: {type: string}
          principal: {type: string}
      drafted_symbols:
        type: array
        items: {type: string}
  formalization_failure:
    required: [diagnostic]
    properties:
      diagnostic: {type: string}
      cleared: {type: boolean}
linkSchemas: {}
interviews:
  request:
    itemType: formalization_request
    completenessRule: all_required
    questions:
      - {key: requirement_id, prompt: "Requirement or criterion id to formalize", type: text, required: true}
      - {key: draft_path, prompt: "Repository-relative path for the .native draft", type: text, required: true}
      - {key: engineering_assurance, prompt: "Absolute path to the engineering-assurance executable", type: text, required: true}
      - {key: allowed_signers, prompt: "Absolute path to the allowed-signers file", type: text, required: true}
