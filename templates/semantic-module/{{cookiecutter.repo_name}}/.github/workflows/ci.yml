name: CI

# Manual dispatch only, matching the rest of the module fleet.
on:
  workflow_dispatch:

jobs:
  ci:
    uses: agent-ix/python-service-actions/.github/workflows/semantic-module-ci.yml@main
    with:
      extra_index_url: https://${{ vars.GCP_REGION }}-python.pkg.dev/${{ vars.GCP_PROJECT_NAME }}/${{ vars.GCP_PYPI }}/simple/
    secrets:
      GCP_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
