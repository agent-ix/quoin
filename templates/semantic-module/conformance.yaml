# Conformance contract for rendered Quire semantic-module repositories.
#
# FR-083-CON-2: a declared file rather than a list inside a test body, so a
# contract change is reviewable on its own.
#
# `required_paths` are repository-relative. A `{package}` segment is replaced by
# the rendered package directory name. A path ending in `/` must exist and be
# non-empty.
contract_version: 1.0.0

all:
  required_paths:
    - LICENSE
    - README.md
    - AGENTS.md
    - CLAUDE.md
    - CONTRIBUTING.md
    - SECURITY.md
    - Makefile
    - pyproject.toml
    - package.json
    - .gitignore
    - .gitattributes
    - .github/CODEOWNERS
    - .github/workflows/ci.yml
    - .github/workflows/release-npm.yml
    - docs/catalog-entry.md
    - typespec/main.tsp
    - typespec/tspconfig.yaml
    - scripts/__init__.py
    - scripts/build_tools.py
    - scripts/stage-npm.mjs
    - "{package}/__init__.py"
    - "{package}/manifest.yaml"
    - "{package}/skeletons/"
    - tests/conftest.py
    - tests/test_manifest_semantic.py
    - tests/test_schema_emission.py
    - tests/test_skeletons_semantic.py
    - tests/fixtures/negative/
    - tests/fixtures/legacy/
    - spec/spec.md
    - spec/index.md
    - spec/stakeholder/index.md
    - spec/usecase/index.md
    - spec/functional/index.md
    - spec/non-functional/index.md

  # A rendered repository must carry none of these, at any depth.
  forbidden_globs:
    - "**/.npmrc"
    - "**/.env"
    - "**/id_rsa"
    - "**/*.pem"

kinds:
  object:
    required_paths: []
  artifact:
    required_paths:
      - "{package}/mappings.yaml"
      - "{package}/examples/"
  mixed:
    required_paths:
      - "{package}/mappings.yaml"
      - "{package}/examples/"

# Residue classes NFR-018 forbids in a rendered file. Each is a declared regular
# expression, so "a credential" is a comparison against a reviewable list rather
# than a judgement made inside a test body.
residue:
  unresolved_token:
    pattern: "\\{\\{\\s*cookiecutter\\.|\\{%\\s*(if|for|endif|endfor|raw|endraw)\\b"
    reason: "an unresolved template token names nothing; the repository would carry the template's placeholder as its identity"
  placeholder_org:
    pattern: "(?i)(your-org|my-org|<org>|<your-|ORGANIZATION_NAME|example\\.com)"
    reason: "a placeholder organization makes a public repository name somebody else's project"
  absolute_render_path:
    pattern: "/home/[A-Za-z0-9_.-]+/|/Users/[A-Za-z0-9_.-]+/|[A-Z]:\\\\Users\\\\"
    reason: "an absolute path binds the repository to the machine that generated it"
  render_timestamp:
    pattern: "\\b20[0-9]{2}-[01][0-9]-[0-3][0-9][T ][0-2][0-9]:[0-5][0-9]"
    reason: "a rendered file carrying the moment it was generated makes two renders of one variant differ, which is the determinism NFR-019 states; a bare calendar date is deliberately not matched, because a changelog or licence year is content rather than render residue"
  credential:
    pattern: "(?i)(BEGIN [A-Z ]*PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|npm_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|(api[_-]?key|secret|password|token)\\s*[:=]\\s*[\"'][^\"'{$][^\"']{7,})"
    reason: "a credential in a public repository is a disclosure"

# `internal-pypi` (us-west1-python.pkg.dev) is the sanctioned index a rendered
# repository depends on, and pkg.dev is not forbidden. Only pypi.ix and npm.ix,
# the dev-only mirrors, are: a rendered repository names neither, and the forbid
# is unconditional — there is no allowed occurrence.
private_registry:
  hosts:
    - "pypi.ix"
    - "npm.ix"
