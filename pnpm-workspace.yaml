packages:
  # Quoin has one lockfile importer. Cookiecutter packages are raw inputs;
  # FR-083 renders and tests their consumers separately outside this workspace.
  - "."

minimumReleaseAge: 14400
minimumReleaseAgeExclude:
  - "@agent-ix/*"
  # Security patches needed sooner than the soak window.
  - "brace-expansion"
  # GHSA-2v37-7h3g-55p8, reached as `.>vite>postcss>nanoid`. postcss admits
  # `^3.3.16`, so the soak window alone held the tree on the vulnerable 3.3.17.
  - "nanoid"

updateConfig:
  ignoreDependencies:
    - typescript

# Fail fast when the configured registry is unreachable. pnpm re-checks package
# metadata for `minimumReleaseAge` even when the lockfile and the store already
# satisfy the install, and its default of two retries a minute apart made an
# unreachable registry look like a hang. These bound a failed fetch to seconds;
# they do not change which registry is used.
fetchRetries: 1
fetchRetryMintimeout: 1000
fetchRetryMaxtimeout: 3000
fetchTimeout: 20000
