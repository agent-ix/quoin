packages:
  # Quoin has one lockfile importer. Cookiecutter packages are raw inputs;
  # FR-083 renders and tests their consumers separately outside this workspace.
  - "."

minimumReleaseAge: 14400
minimumReleaseAgeExclude:
  - "@agent-ix/*"
  # Security patches needed sooner than the soak window.
  - "brace-expansion"
  # GHSA-2v37-7h3g-55p8, reached as `.>vite>postcss>nanoid`. postcss admits
  # `^3.3.16`, so the soak window alone held the tree on the vulnerable 3.3.17.
  - "nanoid"

updateConfig:
  ignoreDependencies:
    - typescript

# Fail fast when the configured registry refuses connections. pnpm re-checks
# package metadata for `minimumReleaseAge` even when the lockfile and the store
# already satisfy the install, and its default retry wait of up to a minute made
# an unreachable registry look like a hang. The retry count and request timeout
# stay at pnpm's defaults; only the wait between retries is shortened. Registry
# selection is untouched.
fetchRetryMintimeout: 1000
fetchRetryMaxtimeout: 3000
