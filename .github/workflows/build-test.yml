name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out safety object types used by Rust integration tests
        uses: actions/checkout@v7
        with:
          repository: agent-ix/spec-objects-safety
          ref: main
          path: .ci-deps/spec-objects-safety
          persist-credentials: false
      - name: Check out artifact process fixtures used by Rust integration tests
        uses: actions/checkout@v7
        with:
          repository: agent-ix/spec-artifacts-process
          ref: main
          path: .ci-deps/spec-artifacts-process
          persist-credentials: false
      - name: Check out security object types used by Rust integration tests
        uses: actions/checkout@v7
        with:
          repository: agent-ix/spec-objects-security
          ref: main
          path: .ci-deps/spec-objects-security
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.15.0
          cache: pnpm
      - name: Install Rust toolchain
        shell: bash
        working-directory: rust
        run: rustup show active-toolchain || rustup toolchain install
      - name: Require private transitive dependency token
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: test -n "$REGISTRY_TOKEN" || { echo "::error::REGISTRY_TOKEN must read private Rust dependencies"; exit 1; }
      - name: Authenticate private Cargo sources
        run: git config --global url."https://x-access-token:${{ secrets.REGISTRY_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - name: Fetch locked Cargo dependencies
        working-directory: rust
        run: cargo fetch --locked
      # rust/crates/quoin-semantic/build.rs embeds the semantic contract out of
      # node_modules/@agent-ix/* (PLAT-887's de-vendoring); `make rust-lint`,
      # `make rust-build` and `make rust-test` all depend on `build-inputs`,
      # but installing it as its own step here keeps it visible and cacheable
      # rather than hidden inside the first Make target that happens to need it.
      - name: Install frozen dependency graph
        run: make build-inputs
      - name: Format and lint
        run: make rust-lint
      - name: Build
        run: make rust-build
      - name: Install default spec modules for Rust integration tests
        run: rust/target/debug/quoin module ensure-defaults
      - name: Install Quire for dossier PDF and DOCX integration tests
        run: |
          npm install --prefix "$RUNNER_TEMP/quoin-quire" --registry=https://registry.npmjs.org/ --@agent-ix:registry=https://registry.npmjs.org/ --ignore-scripts --no-audit --no-fund @agent-ix/quire-cli@0.52.0
          echo "$RUNNER_TEMP/quoin-quire/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install Pandoc for dossier PDF and DOCX integration tests
        uses: pandoc/actions/setup@v1
        with:
          version: 3.14
      - name: Install Typst for dossier PDF integration tests
        uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1
      - name: Install pdftotext for dossier PDF integration tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils=24.02.0-1ubuntu9.11
      - name: Fetch pinned VEX export schemas for integration tests
        run: |
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/openvex/spec/a68ccd19b15a9604d28ef66ebf33f27a772ba4ec/openvex_json_schema.json \
            --output "$RUNNER_TEMP/openvex_json_schema_0.2.0.json"
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/CycloneDX/specification/349314a9d7671d7d2ca5b711a725f49a73979da6/schema/bom-1.7.schema.json \
            --output "$RUNNER_TEMP/cyclonedx_bom_1.7.schema.json"
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/CycloneDX/specification/349314a9d7671d7d2ca5b711a725f49a73979da6/schema/cryptography-defs.schema.json \
            --output "$RUNNER_TEMP/cryptography-defs.schema.json"
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/CycloneDX/specification/349314a9d7671d7d2ca5b711a725f49a73979da6/schema/jsf-0.82.schema.json \
            --output "$RUNNER_TEMP/jsf-0.82.schema.json"
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/CycloneDX/specification/349314a9d7671d7d2ca5b711a725f49a73979da6/schema/spdx.schema.json \
            --output "$RUNNER_TEMP/spdx.schema.json"
      - name: Install strace for syscall isolation tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes strace
      - name: Test
        env:
          SPEC_OBJECTS_SAFETY_DIR: ${{ github.workspace }}/.ci-deps/spec-objects-safety
          SPEC_OBJECTS_SECURITY_DIR: ${{ github.workspace }}/.ci-deps/spec-objects-security
          SPEC_ARTIFACTS_PROCESS_DIR: ${{ github.workspace }}/.ci-deps/spec-artifacts-process
          OPENVEX_SCHEMA_PATH: ${{ runner.temp }}/openvex_json_schema_0.2.0.json
          CYCLONEDX_SCHEMA_PATH: ${{ runner.temp }}/cyclonedx_bom_1.7.schema.json
        run: make rust-test
      - name: Installed workflow behavior
        run: make workflow-test

  rust-deny:
    name: Rust supply chain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rust/Cargo.toml
          command: check

  windows-workflows:
    name: Windows workflow behavior
    runs-on: windows-2025
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.15.0
          cache: pnpm
      - name: Install Rust toolchain
        working-directory: rust
        run: rustup show active-toolchain || rustup toolchain install
      - name: Authenticate private Cargo build inputs
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          test -n "$REGISTRY_TOKEN"
          git config --global url."https://x-access-token:${REGISTRY_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Install build inputs and published runner
        run: |
          pnpm install --frozen-lockfile
          npm install --prefix "$RUNNER_TEMP/quoin-workflow-runner" --registry=https://registry.npmjs.org/ --@agent-ix:registry=https://registry.npmjs.org/ --ignore-scripts --no-audit --no-fund @agent-ix/ix-flow@0.3.4
      - name: Build candidate CLI and native checker
        working-directory: rust
        run: cargo build --locked --target-dir target -p quoin-cli -p quoin-workflow-check
      - name: Exercise installed LF and CRLF plugin workflows
        run: rust/target/debug/quoin-workflow-check.exe smoke rust/target/debug/quoin.exe "$RUNNER_TEMP/quoin-workflow-runner/node_modules/@agent-ix/ix-flow/bin/ix-flow.js" "$GITHUB_WORKSPACE"
