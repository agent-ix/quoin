name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.15.0
          cache: pnpm
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: agent-ix/quire-cli
          ref: 813019d872af7fc6d2469b5afad52f86f16915b4
          path: .ci/quire-cli
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.94.1
      - name: Require private transitive dependency token
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: test -n "$REGISTRY_TOKEN" || { echo "::error::REGISTRY_TOKEN must read private ix-trace-rs"; exit 1; }
      - name: Authenticate private Cargo sources
        run: git config --global url."https://x-access-token:${{ secrets.REGISTRY_TOKEN }}@github.com/".insteadOf "https://github.com/"
      # While the rewrite is active: qa-corpus is private, and the corpus tests
      # read it in place at the locked submodule revision.
      - name: Fetch pinned qa-corpus submodule
        run: git submodule update --init corpus
      - name: Build exact governed Quire source
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          CARGO_NET_GIT_FETCH_WITH_CLI: true
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.REGISTRY_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        run: cargo build --locked --release --manifest-path .ci/quire-cli/Cargo.toml
      - name: Report governed Quire identity
        run: .ci/quire-cli/target/release/quire --version
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      # Default modules include the private engineering-assurance repo, so the
      # one networked install must happen while the rewrite is active. The
      # in-gate reconcile is then offline by contract (NFR-001, IT-001-SC-03).
      - name: Install pinned default modules
        run: |
          make build
          node bin/quoin.js module ensure-defaults
      # battletest's declaration-route guard demands exact https://github.com/
      # routes; leaving the credential rewrite active fails it by design.
      - name: Drop the credential rewrite before governed tests
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: git config --global --remove-section url."https://x-access-token:${REGISTRY_TOKEN}@github.com/"
      # Make's validation and contract gates intentionally refuse a PATH-only
      # Quire. Build the exact source revision above: the published npm 0.30.2
      # wrapper predates source provenance and fails the current contract even
      # though its package version looks current.
      - name: Test with exact governed Quire
        run: make test-with-quire QUIRE="$GITHUB_WORKSPACE/.ci/quire-cli/target/release/quire"

  # The Rust half of the repository (quoin#373 burn-down, Stage 0 = quoin#375).
  #
  # Both trees are gated from ONE checkout of ONE revision, which is FR-101's
  # requirement and the reason `rust/` lives in this repository rather than in
  # a second one. The toolchain is the 1.98.1 NFR-026 names; it is stated in
  # rust/rust-toolchain.toml, rust/clippy.toml and rust/Cargo.toml as well, and
  # quoin-core's tc_375_the_pinned_channel_and_the_declared_msrv_agree fails
  # if this line drifts from those.
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - name: Report the toolchain the gate measured on
        run: cargo --version && rustc --version && cargo clippy --version
      # fmt and clippy first: a formatting or lint failure should come back in
      # seconds rather than behind a full build (the `gate` target's reasoning,
      # applied to this tree).
      - name: Format and lint
        run: make rust-lint
      - name: Build
        run: make rust-build
      - name: Test
        run: make rust-test

  # cargo-deny runs in its own job because it needs a tool the toolchain does
  # not ship. Kept out of `make rust-gate`'s critical path so a supply-chain
  # advisory does not hide a compile error, and vice versa.
  rust-deny:
    name: Rust supply chain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2.1.1
        with:
          manifest-path: rust/Cargo.toml
          command: check

  # FR-101's one-candidate-revision check, run as a job rather than described
  # in a document: the retained TypeScript and quoin-core answer the same
  # requests, from the same checkout, and every difference is reported.
  #
  # It needs BOTH toolchains, which is the whole point — a difftest that could
  # run with one of them would not be comparing two implementations.
  difftest:
    name: Differential harness
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.15.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.98.1
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      # `make rust-difftest` builds both trees itself; it is declared here so a
      # build failure is attributed to the side that failed.
      - name: Compare the retained TypeScript against quoin-core
        run: make rust-difftest

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.15.0
          cache: pnpm
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - run: make lint

  audit:
    name: Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.15.0
          cache: pnpm
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies at high severity
        run: pnpm audit --audit-level=high --prod
