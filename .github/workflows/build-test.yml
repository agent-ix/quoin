name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}
          submodules: recursive
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.15.0
          cache: pnpm
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: agent-ix/quire-cli
          ref: bcface2714a958a328f3427714650ab2df71030f
          path: .ci/quire-cli
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.94.1
      - name: Require private transitive dependency token
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: test -n "$REGISTRY_TOKEN" || { echo "::error::REGISTRY_TOKEN must read private ix-trace-rs"; exit 1; }
      - name: Build exact governed Quire source
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.REGISTRY_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        run: cargo build --locked --release --manifest-path .ci/quire-cli/Cargo.toml
      - name: Report governed Quire identity
        run: .ci/quire-cli/target/release/quire --version
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      # Make's validation and contract gates intentionally refuse a PATH-only
      # Quire. Build the exact source revision above: the published npm 0.30.2
      # wrapper predates source provenance and fails the current contract even
      # though its package version looks current.
      - name: Test with exact governed Quire
        run: make test QUIRE="$GITHUB_WORKSPACE/.ci/quire-cli/target/release/quire"

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.15.0
          cache: pnpm
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - run: make lint

  audit:
    name: Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.15.0
          cache: pnpm
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies at high severity
        run: pnpm audit --audit-level=high --prod
