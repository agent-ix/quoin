name: Native release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to package and release
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build native release artifacts
    permissions:
      contents: read
    uses: ./.github/workflows/native-release-build.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit

  publish:
    name: Publish GitHub Release assets
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: release
          merge-multiple: true
      - name: Create and upload the manual GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # This job has no checkout, so gh cannot infer the repository.
          # --generate-notes is not optional: gh writes no body at all unless a
          # notes flag is passed, and every release cut here before PLAT-1055
          # published with an empty one. GitHub builds the merged-PR list and
          # the compare link server-side, so this works without a checkout. A
          # hand-written changelog goes on afterwards with `gh release edit
          # "$TAG" --notes-file …`; this guarantees the floor.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Quoin $TAG" release/*
