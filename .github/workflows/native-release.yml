name: Native release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to package and release
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.target }}
    # A hung step otherwise blocks for GitHub's 6-hour default.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The platform set quire-cli ships.
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            extension: tar.gz
            binary: quoin
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            extension: tar.gz
            binary: quoin
          - runner: macos-14
            target: aarch64-apple-darwin
            extension: tar.gz
            binary: quoin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            extension: zip
            binary: quoin.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.15.0
          cache: pnpm
      # @agent-ix/* scoped packages live on GitHub Packages (npm.ix's
      # target), not public npm. Without this, `pnpm install` below falls
      # back to registry.npmjs.org and 404s on every @agent-ix package.
      - uses: agent-ix/nodejs-actions/setup-npmrc@main
        with:
          npm_registry_token: ${{ secrets.REGISTRY_TOKEN }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.1
      # rust/crates/quoin-semantic/build.rs embeds the semantic contract out of
      # node_modules/@agent-ix/* (PLAT-887's de-vendoring), so every platform
      # in this matrix -- including Windows, where pnpm/action-setup and
      # actions/setup-node both run natively -- needs it before `cargo build`.
      - name: Install frozen dependency graph
        shell: bash
        run: pnpm install --frozen-lockfile
      - name: Build the native quoin artifact
        shell: bash
        run: cd rust && cargo build --locked --release -p quoin-cli --bin quoin
      - name: Package the one permitted archive member
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXTENSION: ${{ matrix.extension }}
          BINARY: ${{ matrix.binary }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          NAME="quoin-v${VERSION}-${TARGET}.${EXTENSION}"
          mkdir release
          if [ "$EXTENSION" = tar.gz ]; then
            tar -C rust/target/release -czf "release/$NAME" "$BINARY"
          else
            # Git Bash on the Windows runner has no `zip`; 7-Zip is preinstalled.
            (cd rust/target/release && 7z a -tzip -bso0 "../../../release/$NAME" "$BINARY")
          fi
          test -f "release/$NAME"
      - name: Smoke the packaged native executable
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXTENSION: ${{ matrix.extension }}
          BINARY: ${{ matrix.binary }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          NAME="quoin-v${VERSION}-${TARGET}.${EXTENSION}"
          mkdir release-smoke
          if [ "$EXTENSION" = tar.gz ]; then
            tar -C release-smoke -xzf "release/$NAME"
          else
            7z x -bso0 -orelease-smoke "release/$NAME"
          fi
          test "$(find release-smoke -type f | wc -l | tr -d ' ')" = 1
          test -f "release-smoke/$BINARY"
          "./release-smoke/$BINARY" --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quoin-${{ matrix.target }}
          path: release/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release assets
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release
          merge-multiple: true
      - name: Build the stable release manifest
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          asset() {
            target="$1"; suffix="$2"; format="$3"
            name="quoin-v${VERSION}-${target}.${suffix}"
            size=$(wc -c < "release/$name" | tr -d ' ')
            digest=$(sha256sum "release/$name" | cut -d ' ' -f1)
            jq -n --arg target "$target" --arg asset "$name" --arg archive "$format" --argjson size "$size" --arg sha256 "$digest" --arg url "https://github.com/${REPOSITORY}/releases/download/${TAG}/${name}" '{target:$target,asset:$asset,archive:$archive,size:$size,sha256:$sha256,url:$url}'
          }
          jq -n --arg version "$VERSION" --slurpfile artifacts <(asset x86_64-unknown-linux-gnu tar.gz tar-gz; asset aarch64-unknown-linux-gnu tar.gz tar-gz; asset aarch64-apple-darwin tar.gz tar-gz; asset x86_64-pc-windows-msvc zip zip) '{schema_version:1,version:$version,artifacts:$artifacts}' > release/quoin-update-manifest.json
          jq -e '.schema_version == 1 and (.artifacts | length == 4)' release/quoin-update-manifest.json
      - name: Create and upload the manual GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --verify-tag --title "Quoin $TAG" release/*
