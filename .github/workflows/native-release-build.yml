name: Native release build

on:
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string
      include_evidence:
        description: Produce and retain Quoin release evidence
        required: false
        default: false
        type: boolean
    secrets:
      REGISTRY_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.target }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            extension: tar.gz
            binary: quoin
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            extension: tar.gz
            binary: quoin
          - runner: macos-15
            target: aarch64-apple-darwin
            extension: tar.gz
            binary: quoin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            extension: zip
            binary: quoin.exe
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.15.0
          cache: pnpm
      - name: Install Rust toolchain
        shell: bash
        working-directory: rust
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install frozen dependency graph
        shell: bash
        run: pnpm install --frozen-lockfile
      - name: Authenticate private Cargo build inputs
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REGISTRY_TOKEN" || { echo "::error::REGISTRY_TOKEN must read private Rust build dependencies" >&2; exit 1; }
          cleanup() {
            git config --global --unset-all "url.https://x-access-token:${REGISTRY_TOKEN}@github.com/.insteadOf" || true
          }
          trap cleanup EXIT
          git config --global url."https://x-access-token:${REGISTRY_TOKEN}@github.com/".insteadOf "https://github.com/"
          cd rust
          cargo fetch --locked
      - name: Build the native quoin artifact
        shell: bash
        run: cd rust && cargo build --locked --release -p quoin-cli --bin quoin
      - name: Package the one permitted archive member
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXTENSION: ${{ matrix.extension }}
          BINARY: ${{ matrix.binary }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          NAME="quoin-v${VERSION}-${TARGET}.${EXTENSION}"
          mkdir release
          if [ "$EXTENSION" = tar.gz ]; then
            tar -C rust/target/release -czf "release/$NAME" "$BINARY"
          else
            (cd rust/target/release && 7z a -tzip -bso0 "../../../release/$NAME" "$BINARY")
          fi
          test -f "release/$NAME"
      - name: Validate the packaged native executable and module catalog
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXTENSION: ${{ matrix.extension }}
          BINARY: ${{ matrix.binary }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          NAME="quoin-v${VERSION}-${TARGET}.${EXTENSION}"
          mkdir release-smoke
          if [ "$EXTENSION" = tar.gz ]; then
            tar -C release-smoke -xzf "release/$NAME"
          else
            7z x -bso0 -orelease-smoke "release/$NAME"
          fi
          test "$(find release-smoke -type f | wc -l | tr -d ' ')" = 1
          test -f "release-smoke/$BINARY"
          "./release-smoke/$BINARY" --version
          CLEAN_HOME="$(mktemp -d)"
          HOME="$CLEAN_HOME" USERPROFILE="$CLEAN_HOME" IX_HOME="$CLEAN_HOME/.ix" "./release-smoke/$BINARY" module ensure-defaults > /dev/null
          HOME="$CLEAN_HOME" USERPROFILE="$CLEAN_HOME" IX_HOME="$CLEAN_HOME/.ix" "./release-smoke/$BINARY" catalog validate
      - name: Run the Linux self-test or record not run
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BINARY: release-smoke/${{ matrix.binary }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            x86_64-unknown-linux-gnu|aarch64-unknown-linux-gnu)
              "$BINARY" selftest --run --out "$RUNNER_TEMP/quoin-selftest-$TARGET.json"
              ;;
            *)
              printf 'Quoin self-test: not run on %s (native self-tests are Linux-only).\n' "$TARGET" | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
          esac
      - name: Prepare Quoin workflow smoke checker
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/quoin-workflow-runner" --registry=https://registry.npmjs.org/ --@agent-ix:registry=https://registry.npmjs.org/ --ignore-scripts --no-audit --no-fund @agent-ix/ix-flow@0.3.4
          (cd rust && cargo build --locked --target-dir target -p quoin-workflow-check)
      - name: Smoke the packaged native executable through ix-flow
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          CHECKER="rust/target/debug/quoin-workflow-check"
          if [ "$BINARY" = quoin.exe ]; then CHECKER="${CHECKER}.exe"; fi
          SMOKE_LOG="$RUNNER_TEMP/quoin-workflow-smoke.log"
          set +e
          "$CHECKER" smoke "release-smoke/$BINARY" "$RUNNER_TEMP/quoin-workflow-runner/node_modules/@agent-ix/ix-flow/bin/ix-flow.js" "$GITHUB_WORKSPACE" >"$SMOKE_LOG" 2>&1
          SMOKE_STATUS=$?
          set -e
          cat "$SMOKE_LOG"
          if [ "$SMOKE_STATUS" -eq 0 ]; then
            exit 0
          fi
          exit "$SMOKE_STATUS"
      - uses: actions/upload-artifact@v7
        with:
          name: quoin-${{ matrix.target }}
          path: release/
          if-no-files-found: error

  assemble:
    name: Assemble the native release artifact set
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: quoin-*
          path: release
          merge-multiple: true
      - name: Build the stable release manifest
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          asset() {
            target="$1"; suffix="$2"; format="$3"
            name="quoin-v${VERSION}-${target}.${suffix}"
            size=$(wc -c < "release/$name" | tr -d ' ')
            jq -n --arg target "$target" --arg asset "$name" --arg archive "$format" --argjson size "$size" --arg url "https://github.com/${REPOSITORY}/releases/download/${TAG}/${name}" '{target:$target,asset:$asset,archive:$archive,size:$size,url:$url}'
          }
          jq -n --arg version "$VERSION" --slurpfile artifacts <(asset x86_64-unknown-linux-gnu tar.gz tar-gz; asset aarch64-unknown-linux-gnu tar.gz tar-gz; asset aarch64-apple-darwin tar.gz tar-gz; asset x86_64-pc-windows-msvc zip zip) '{schema_version:2,version:$version,artifacts:$artifacts}' > release/quoin-update-manifest.json
          jq -e '.schema_version == 2 and (.artifacts | length == 4)' release/quoin-update-manifest.json
      - uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: release/
          if-no-files-found: error

  evidence:
    name: Produce and validate retained release evidence
    if: inputs.include_evidence
    needs: assemble
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: release-artifacts
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Confirm the checkout is the tagged commit
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.15.0
      - name: Install Rust toolchain and nextest
        shell: bash
        working-directory: rust
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install
          cargo install cargo-nextest --locked
      - name: Fetch private Cargo inputs for the evidence producer
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REGISTRY_TOKEN" || { echo "::error::REGISTRY_TOKEN must read private Rust build dependencies" >&2; exit 1; }
          cleanup() {
            git config --global --unset-all "url.https://x-access-token:${REGISTRY_TOKEN}@github.com/.insteadOf" || true
          }
          trap cleanup EXIT
          git config --global url."https://x-access-token:${REGISTRY_TOKEN}@github.com/".insteadOf "https://github.com/"
          cd rust
          cargo fetch --locked
      - name: Run and validate retained release evidence
        env:
          npm_config_registry: https://registry.npmjs.org
          EXPECTED_TAG: ${{ inputs.tag }}
          TAG_NAME: ${{ inputs.tag }}
          SOURCE_REVISION: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_NAME: ${{ github.workflow }}
        shell: bash
        run: |
          set -euo pipefail

          validate_binding_traces() {
            local bindings_file="$1"
            local runs_file="$2"
            jq -e --slurpfile runs "$runs_file" '
              any(.bindings[]; .suite == "SUITE-001")
              and all(.bindings[] | select(.suite == "SUITE-001");
                . as $binding |
                any($runs[0][];
                  .suite == "SUITE-001"
                  and any(.entries[];
                    . as $entry |
                    $entry.outcome == "pass"
                    and (($binding.symbols | index($entry.symbol)) != null)
                    and ((($entry.traceIds // []) | index($binding.obligation)) != null)
                  )
                )
              )
            ' "$bindings_file" >/dev/null
          }

          test_dir="$RUNNER_TEMP/quoin-evidence-binding-test"
          mkdir -p "$test_dir"
          jq -n '{schemaVersion:1,bindings:[{obligation:"FR-AC-1",suite:"SUITE-001",symbols:["tests::bound"]}]}' > "$test_dir/bindings.json"
          jq -n '{schemaVersion:1,suite:"SUITE-001",evidenceKind:"Unit",entries:[{symbol:"tests::bound",outcome:"pass",traceIds:["FR-OTHER"]},{symbol:"tests::unrelated",outcome:"pass",traceIds:["FR-AC-1"]}]}' > "$test_dir/unrelated-run.json"
          jq -s . "$test_dir/unrelated-run.json" > "$test_dir/unrelated-runs.json"
          if validate_binding_traces "$test_dir/bindings.json" "$test_dir/unrelated-runs.json"; then
            echo "::error::evidence validator accepted a passing test without the bound obligation trace" >&2
            exit 1
          fi

          jq -n '{schemaVersion:1,suite:"SUITE-001",evidenceKind:"Unit",entries:[{symbol:"tests::bound",outcome:"pass",traceIds:["FR-AC-1"]},{symbol:"tests::unrelated",outcome:"pass",traceIds:["FR-AC-1"]}]}' > "$test_dir/matching-run.json"
          jq -s . "$test_dir/matching-run.json" > "$test_dir/matching-runs.json"
          validate_binding_traces "$test_dir/bindings.json" "$test_dir/matching-runs.json" || {
            echo "::error::evidence validator rejected a passing bound symbol with its obligation trace" >&2
            exit 1
          }

          started_at=$(date +%s)
          evidence_status=0
          make evidence || evidence_status=$?

          bindings=spec/evidence/bindings.json
          jq -e '.schemaVersion == 1 and any(.bindings[]; .suite == "SUITE-001")' "$bindings" >/dev/null || {
            echo "::error::no_retained_evidence_store: maintained SUITE-001 evidence binding is missing or invalid" >&2
            exit 1
          }

          mapfile -t records < <(find spec/evidence/runs/SUITE-001 -type f -name '*.json' -newermt "@$started_at" -print 2>/dev/null | sort)
          if [ "${#records[@]}" -gt 1 ]; then
            echo "::error::no_retained_evidence_store: multiple SUITE-001 records were produced in one tag run" >&2
            exit 1
          fi
          for record in "${records[@]}"; do
            jq -e '.schemaVersion == 1 and .suite == "SUITE-001" and .evidenceKind == "Unit" and (.entries | type == "array" and length > 0)' "$record" >/dev/null || {
              echo "::error::no_retained_evidence_store: a current-job SUITE-001 run record is invalid" >&2
              exit 1
            }
          done
          current_runs="$RUNNER_TEMP/quoin-evidence-current-runs.json"
          if [ "${#records[@]}" -eq 1 ]; then jq -s . "${records[@]}" > "$current_runs"; else printf '[]\n' > "$current_runs"; fi
          printf '%s\n' "${records[@]}" > "$RUNNER_TEMP/quoin-evidence-current-records.txt"
          if [ "$evidence_status" -eq 0 ] && [ "${#records[@]}" -eq 1 ] && ! validate_binding_traces "$bindings" "$current_runs"; then
            echo "::error::no_retained_evidence_store: a bound obligation lacks a passing symbol with that trace in the current run records" >&2
            exit 1
          fi

          matrix_file=spec/evidence/test-matrix.json
          quoin matrix --repo . --json > "$RUNNER_TEMP/quoin-test-matrix.json"
          export EVIDENCE_STATUS="$evidence_status"
          python3 - "$RUNNER_TEMP/quoin-test-matrix.json" "$matrix_file" "$RUNNER_TEMP/execution-provenance-predicate.json" "$RUNNER_TEMP/quoin-evidence-current-records.txt" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          raw = json.loads(Path(sys.argv[1]).read_bytes())
          matrix = raw.get("requirements") if isinstance(raw, dict) else None
          if not isinstance(matrix, list) or not matrix:
              raise SystemExit("release_provenance_matrix_invalid")
          active = []
          for row in matrix:
              if not isinstance(row, dict) or not isinstance(row.get("criteria"), list):
                  raise SystemExit("release_provenance_matrix_invalid")
              active.extend(c for c in row["criteria"] if isinstance(c, dict) and c.get("status") != "retired")
          if not active:
              raise SystemExit("release_provenance_matrix_empty")
          matrix_bytes = json.dumps(matrix, separators=(",", ":"), ensure_ascii=False).encode()
          Path(sys.argv[2]).write_bytes(matrix_bytes + b"\n")
          evidence = Path("spec/evidence")
          records = [Path(item) for item in Path(sys.argv[4]).read_text().splitlines() if item]
          if len(records) > 1:
              raise SystemExit("release_provenance_run_population_invalid")
          if records:
              record = records[0]
              record_path = record.relative_to(evidence).as_posix()
              digest = hashlib.sha256(record.read_bytes()).hexdigest()
          else:
              record_path = "runs/SUITE-001/absent.json"
              digest = None
          suites = (evidence / "suites.md").read_bytes()
          predicate = {
              "version": 2,
              "sourceRevision": os.environ["SOURCE_REVISION"],
              "suiteDeclarationsSha256": hashlib.sha256(suites).hexdigest(),
              "testMatrix": matrix,
              "runs": [{"suite": "SUITE-001", "recordPath": record_path, "sha256": digest}],
          }
          Path(sys.argv[3]).write_text(json.dumps(predicate, separators=(",", ":")), encoding="utf-8")
          metadata = {
              "tag": os.environ["TAG_NAME"],
              "sourceRevision": os.environ["SOURCE_REVISION"],
              "workflowRunId": os.environ["WORKFLOW_RUN_ID"],
              "workflowRunAttempt": os.environ["WORKFLOW_RUN_ATTEMPT"],
              "workflowName": os.environ["WORKFLOW_NAME"],
              "evidenceExitCode": int(os.environ.get("EVIDENCE_STATUS", "0")),
          }
          (evidence / "release-provenance.json").write_text(json.dumps(metadata, separators=(",", ":")), encoding="utf-8")
          PY
          test "$evidence_status" -eq 0 || echo "::warning::release_evidence_suite_failed: signed provenance records incomplete evidence for the shared consumer" >&2
      - name: Sign release execution provenance
        id: attest-execution-provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-artifacts/**
          predicate-type: application/vnd.agent-ix.execution-provenance.v2+json
          predicate-path: ${{ runner.temp }}/execution-provenance-predicate.json
          create-storage-record: false
      - name: Retain signed provenance bundle
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.attest-execution-provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "$BUNDLE_PATH"
          cp -- "$BUNDLE_PATH" spec/evidence/execution-provenance.dsse.json
      - uses: actions/upload-artifact@v7
        with:
          name: release-evidence
          path: spec/evidence/
          if-no-files-found: error
