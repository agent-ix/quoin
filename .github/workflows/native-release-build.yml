name: Native release build

on:
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string
      include_evidence:
        description: Produce and retain Quoin release evidence
        required: false
        default: false
        type: boolean
    secrets:
      REGISTRY_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.target }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            extension: tar.gz
            binary: quoin
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            extension: tar.gz
            binary: quoin
          - runner: macos-15
            target: aarch64-apple-darwin
            extension: tar.gz
            binary: quoin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            extension: zip
            binary: quoin.exe
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.15.0
          cache: pnpm
      - name: Install Rust toolchain
        shell: bash
        working-directory: rust
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install frozen dependency graph
        shell: bash
        run: pnpm install --frozen-lockfile
      - name: Authenticate private Cargo build inputs
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REGISTRY_TOKEN" || { echo "::error::REGISTRY_TOKEN must read private Rust build dependencies" >&2; exit 1; }
          cleanup() {
            git config --global --unset-all "url.https://x-access-token:${REGISTRY_TOKEN}@github.com/.insteadOf" || true
          }
          trap cleanup EXIT
          git config --global url."https://x-access-token:${REGISTRY_TOKEN}@github.com/".insteadOf "https://github.com/"
          cd rust
          cargo fetch --locked
      - name: Build the native quoin artifact
        shell: bash
        run: cd rust && cargo build --locked --release -p quoin-cli --bin quoin
      - name: Package the one permitted archive member
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXTENSION: ${{ matrix.extension }}
          BINARY: ${{ matrix.binary }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          NAME="quoin-v${VERSION}-${TARGET}.${EXTENSION}"
          mkdir release
          if [ "$EXTENSION" = tar.gz ]; then
            tar -C rust/target/release -czf "release/$NAME" "$BINARY"
          else
            (cd rust/target/release && 7z a -tzip -bso0 "../../../release/$NAME" "$BINARY")
          fi
          test -f "release/$NAME"
      - name: Smoke the packaged native executable
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXTENSION: ${{ matrix.extension }}
          BINARY: ${{ matrix.binary }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          NAME="quoin-v${VERSION}-${TARGET}.${EXTENSION}"
          mkdir release-smoke
          if [ "$EXTENSION" = tar.gz ]; then
            tar -C release-smoke -xzf "release/$NAME"
          else
            7z x -bso0 -orelease-smoke "release/$NAME"
          fi
          test "$(find release-smoke -type f | wc -l | tr -d ' ')" = 1
          test -f "release-smoke/$BINARY"
          "./release-smoke/$BINARY" --version
          CLEAN_HOME="$(mktemp -d)"
          HOME="$CLEAN_HOME" USERPROFILE="$CLEAN_HOME" IX_HOME="$CLEAN_HOME/.ix" "./release-smoke/$BINARY" module ensure-defaults > /dev/null
          HOME="$CLEAN_HOME" USERPROFILE="$CLEAN_HOME" IX_HOME="$CLEAN_HOME/.ix" "./release-smoke/$BINARY" catalog validate
          npm install --prefix "$RUNNER_TEMP/quoin-workflow-runner" --registry=https://registry.npmjs.org/ --@agent-ix:registry=https://registry.npmjs.org/ --ignore-scripts --no-audit --no-fund @agent-ix/ix-flow@0.3.1
          (cd rust && cargo build --locked --target-dir target -p quoin-workflow-check)
          CHECKER="rust/target/debug/quoin-workflow-check"
          if [ "$BINARY" = quoin.exe ]; then CHECKER="${CHECKER}.exe"; fi
          "$CHECKER" smoke "release-smoke/$BINARY" "$RUNNER_TEMP/quoin-workflow-runner/node_modules/@agent-ix/ix-flow/bin/ix-flow.js" "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v7
        with:
          name: quoin-${{ matrix.target }}
          path: release/
          if-no-files-found: error

  assemble:
    name: Assemble the native release artifact set
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: quoin-*
          path: release
          merge-multiple: true
      - name: Build the stable release manifest
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          asset() {
            target="$1"; suffix="$2"; format="$3"
            name="quoin-v${VERSION}-${target}.${suffix}"
            size=$(wc -c < "release/$name" | tr -d ' ')
            jq -n --arg target "$target" --arg asset "$name" --arg archive "$format" --argjson size "$size" --arg url "https://github.com/${REPOSITORY}/releases/download/${TAG}/${name}" '{target:$target,asset:$asset,archive:$archive,size:$size,url:$url}'
          }
          jq -n --arg version "$VERSION" --slurpfile artifacts <(asset x86_64-unknown-linux-gnu tar.gz tar-gz; asset aarch64-unknown-linux-gnu tar.gz tar-gz; asset aarch64-apple-darwin tar.gz tar-gz; asset x86_64-pc-windows-msvc zip zip) '{schema_version:2,version:$version,artifacts:$artifacts}' > release/quoin-update-manifest.json
          jq -e '.schema_version == 2 and (.artifacts | length == 4)' release/quoin-update-manifest.json
      - uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: release/
          if-no-files-found: error

  evidence:
    name: Produce and validate retained release evidence
    if: inputs.include_evidence
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Confirm the checkout is the tagged commit
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.15.0
      - name: Install Rust toolchain and nextest
        shell: bash
        working-directory: rust
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install
          cargo install cargo-nextest --locked
      - name: Fetch private Cargo inputs for the evidence producer
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REGISTRY_TOKEN" || { echo "::error::REGISTRY_TOKEN must read private Rust build dependencies" >&2; exit 1; }
          cleanup() {
            git config --global --unset-all "url.https://x-access-token:${REGISTRY_TOKEN}@github.com/.insteadOf" || true
          }
          trap cleanup EXIT
          git config --global url."https://x-access-token:${REGISTRY_TOKEN}@github.com/".insteadOf "https://github.com/"
          cd rust
          cargo fetch --locked
      - name: Run and validate retained release evidence
        env:
          npm_config_registry: https://registry.npmjs.org
        shell: bash
        run: |
          set -euo pipefail

          validate_binding_traces() {
            local bindings_file="$1"
            local runs_file="$2"
            jq -e --slurpfile runs "$runs_file" '
              any(.bindings[]; .suite == "SUITE-001")
              and all(.bindings[] | select(.suite == "SUITE-001");
                . as $binding |
                any($runs[0][];
                  .suite == "SUITE-001"
                  and any(.entries[];
                    . as $entry |
                    $entry.outcome == "pass"
                    and (($binding.symbols | index($entry.symbol)) != null)
                    and ((($entry.traceIds // []) | index($binding.obligation)) != null)
                  )
                )
              )
            ' "$bindings_file" >/dev/null
          }

          test_dir="$RUNNER_TEMP/quoin-evidence-binding-test"
          mkdir -p "$test_dir"
          jq -n '{schemaVersion:1,bindings:[{obligation:"FR-AC-1",suite:"SUITE-001",symbols:["tests::bound"]}]}' > "$test_dir/bindings.json"
          jq -n '{schemaVersion:1,suite:"SUITE-001",evidenceKind:"Unit",entries:[{symbol:"tests::bound",outcome:"pass",traceIds:["FR-OTHER"]},{symbol:"tests::unrelated",outcome:"pass",traceIds:["FR-AC-1"]}]}' > "$test_dir/unrelated-run.json"
          jq -s . "$test_dir/unrelated-run.json" > "$test_dir/unrelated-runs.json"
          if validate_binding_traces "$test_dir/bindings.json" "$test_dir/unrelated-runs.json"; then
            echo "::error::evidence validator accepted a passing test without the bound obligation trace" >&2
            exit 1
          fi

          jq -n '{schemaVersion:1,suite:"SUITE-001",evidenceKind:"Unit",entries:[{symbol:"tests::bound",outcome:"pass",traceIds:["FR-AC-1"]},{symbol:"tests::unrelated",outcome:"pass",traceIds:["FR-AC-1"]}]}' > "$test_dir/matching-run.json"
          jq -s . "$test_dir/matching-run.json" > "$test_dir/matching-runs.json"
          validate_binding_traces "$test_dir/bindings.json" "$test_dir/matching-runs.json" || {
            echo "::error::evidence validator rejected a passing bound symbol with its obligation trace" >&2
            exit 1
          }

          started_at=$(date +%s)
          if ! make evidence; then
            echo "::error::no_retained_evidence_store: make evidence did not produce run records and bindings for the tagged commit" >&2
            exit 1
          fi

          bindings=spec/evidence/bindings.json
          jq -e '.schemaVersion == 1 and any(.bindings[]; .suite == "SUITE-001" and (.symbols | length > 0))' "$bindings" >/dev/null || {
            echo "::error::no_retained_evidence_store: evidence bindings are empty or invalid" >&2
            exit 1
          }

          mapfile -t records < <(find spec/evidence/runs/SUITE-001 -type f -name '*.json' -newermt "@$started_at" -print 2>/dev/null)
          if [ "${#records[@]}" -eq 0 ]; then
            echo "::error::no_retained_evidence_store: no SUITE-001 run record was created during this tagged-commit job" >&2
            exit 1
          fi
          for record in "${records[@]}"; do
            jq -e '.schemaVersion == 1 and .suite == "SUITE-001" and .evidenceKind == "Unit" and (.entries | type == "array" and length > 0)' "$record" >/dev/null || {
              echo "::error::no_retained_evidence_store: a current-job SUITE-001 run record is invalid" >&2
              exit 1
            }
          done
          current_runs="$RUNNER_TEMP/quoin-evidence-current-runs.json"
          jq -s . "${records[@]}" > "$current_runs"
          if ! validate_binding_traces "$bindings" "$current_runs"; then
            echo "::error::no_retained_evidence_store: a bound obligation lacks a passing symbol with that trace in the current run records" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-evidence
          path: spec/evidence/
          if-no-files-found: error
