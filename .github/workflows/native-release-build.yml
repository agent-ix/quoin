name: Native release build

on:
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string
      include_evidence:
        description: Produce and retain Quoin release evidence
        required: false
        default: false
        type: boolean
    secrets:
      REGISTRY_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.target }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            extension: tar.gz
            binary: quoin
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            extension: tar.gz
            binary: quoin
          - runner: macos-15
            target: aarch64-apple-darwin
            extension: tar.gz
            binary: quoin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            extension: zip
            binary: quoin.exe
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.15.0
          cache: pnpm
      - name: Install Rust toolchain
        shell: bash
        working-directory: rust
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install frozen dependency graph
        shell: bash
        run: pnpm install --frozen-lockfile
      - name: Authenticate private Cargo build inputs
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REGISTRY_TOKEN" || { echo "::error::REGISTRY_TOKEN must read private Rust build dependencies" >&2; exit 1; }
          cleanup() {
            git config --global --unset-all "url.https://x-access-token:${REGISTRY_TOKEN}@github.com/.insteadOf" || true
          }
          trap cleanup EXIT
          git config --global url."https://x-access-token:${REGISTRY_TOKEN}@github.com/".insteadOf "https://github.com/"
          cd rust
          cargo fetch --locked
      - name: Build the native quoin artifact
        shell: bash
        run: cd rust && cargo build --locked --release -p quoin-cli --bin quoin
      - name: Package the one permitted archive member
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXTENSION: ${{ matrix.extension }}
          BINARY: ${{ matrix.binary }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          NAME="quoin-v${VERSION}-${TARGET}.${EXTENSION}"
          mkdir release
          if [ "$EXTENSION" = tar.gz ]; then
            tar -C rust/target/release -czf "release/$NAME" "$BINARY"
          else
            (cd rust/target/release && 7z a -tzip -bso0 "../../../release/$NAME" "$BINARY")
          fi
          test -f "release/$NAME"
      - name: Validate the packaged native executable and module catalog
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXTENSION: ${{ matrix.extension }}
          BINARY: ${{ matrix.binary }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          NAME="quoin-v${VERSION}-${TARGET}.${EXTENSION}"
          mkdir release-smoke
          if [ "$EXTENSION" = tar.gz ]; then
            tar -C release-smoke -xzf "release/$NAME"
          else
            7z x -bso0 -orelease-smoke "release/$NAME"
          fi
          test "$(find release-smoke -type f | wc -l | tr -d ' ')" = 1
          test -f "release-smoke/$BINARY"
          "./release-smoke/$BINARY" --version
          CLEAN_HOME="$(mktemp -d)"
          HOME="$CLEAN_HOME" USERPROFILE="$CLEAN_HOME" IX_HOME="$CLEAN_HOME/.ix" "./release-smoke/$BINARY" module ensure-defaults > /dev/null
          HOME="$CLEAN_HOME" USERPROFILE="$CLEAN_HOME" IX_HOME="$CLEAN_HOME/.ix" "./release-smoke/$BINARY" catalog validate
      - name: Prepare Quoin workflow smoke checker
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/quoin-workflow-runner" --registry=https://registry.npmjs.org/ --@agent-ix:registry=https://registry.npmjs.org/ --ignore-scripts --no-audit --no-fund @agent-ix/ix-flow@0.3.4
          (cd rust && cargo build --locked --target-dir target -p quoin-workflow-check)
      - name: Smoke the packaged native executable through ix-flow
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          CHECKER="rust/target/debug/quoin-workflow-check"
          if [ "$BINARY" = quoin.exe ]; then CHECKER="${CHECKER}.exe"; fi
          SMOKE_LOG="$RUNNER_TEMP/quoin-workflow-smoke.log"
          set +e
          "$CHECKER" smoke "release-smoke/$BINARY" "$RUNNER_TEMP/quoin-workflow-runner/node_modules/@agent-ix/ix-flow/bin/ix-flow.js" "$GITHUB_WORKSPACE" >"$SMOKE_LOG" 2>&1
          SMOKE_STATUS=$?
          set -e
          cat "$SMOKE_LOG"
          if [ "$SMOKE_STATUS" -eq 0 ]; then
            exit 0
          fi
          exit "$SMOKE_STATUS"
      - name: Assert the packaged native workflow lifecycle without credentials
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          QUOIN_BINARY="$GITHUB_WORKSPACE/release-smoke/$BINARY" \
          IX_FLOW_RUNNER="$RUNNER_TEMP/quoin-workflow-runner/node_modules/@agent-ix/ix-flow/bin/ix-flow.js" \
          QUOIN_PLUGIN_ROOT="$GITHUB_WORKSPACE" \
            cargo test --locked --manifest-path rust/Cargo.toml --target-dir rust/target -p quoin-workflow-check --features workflow-test smoke::tests::tc_fr021_packaged_install_runs_plugin_workflow_without_credentials -- --exact --test-threads=4

      - uses: actions/upload-artifact@v7
        with:
          name: quoin-${{ matrix.target }}
          path: release/
          if-no-files-found: error

  assemble:
    name: Assemble the native release artifact set
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: quoin-*
          path: release
          merge-multiple: true
      - name: Build the stable release manifest
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          asset() {
            target="$1"; suffix="$2"; format="$3"
            name="quoin-v${VERSION}-${target}.${suffix}"
            size=$(wc -c < "release/$name" | tr -d ' ')
            jq -n --arg target "$target" --arg asset "$name" --arg archive "$format" --argjson size "$size" --arg url "https://github.com/${REPOSITORY}/releases/download/${TAG}/${name}" '{target:$target,asset:$asset,archive:$archive,size:$size,url:$url}'
          }
          jq -n --arg version "$VERSION" --slurpfile artifacts <(asset x86_64-unknown-linux-gnu tar.gz tar-gz; asset aarch64-unknown-linux-gnu tar.gz tar-gz; asset aarch64-apple-darwin tar.gz tar-gz; asset x86_64-pc-windows-msvc zip zip) '{schema_version:2,version:$version,artifacts:$artifacts}' > release/quoin-update-manifest.json
          jq -e '.schema_version == 2 and (.artifacts | length == 4)' release/quoin-update-manifest.json
      - uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: release/
          if-no-files-found: error

  evidence:
    name: Produce and validate retained release evidence
    if: inputs.include_evidence
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Confirm the checkout is the tagged commit
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.15.0
      - name: Install Rust toolchain and nextest
        shell: bash
        working-directory: rust
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install
          cargo install cargo-nextest --locked
      - name: Fetch private Cargo inputs for the evidence producer
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REGISTRY_TOKEN" || { echo "::error::REGISTRY_TOKEN must read private Rust build dependencies" >&2; exit 1; }
          cleanup() {
            git config --global --unset-all "url.https://x-access-token:${REGISTRY_TOKEN}@github.com/.insteadOf" || true
          }
          trap cleanup EXIT
          git config --global url."https://x-access-token:${REGISTRY_TOKEN}@github.com/".insteadOf "https://github.com/"
          cd rust
          cargo fetch --locked
      - name: Install cosign for OIDC-backed DSSE provenance
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad
        with:
          cosign-release: v3.0.2
      - name: Run and validate retained release evidence
        env:
          npm_config_registry: https://registry.npmjs.org
          EXPECTED_TAG: ${{ inputs.tag }}
          TAG_NAME: ${{ github.ref_name }}
          SOURCE_REVISION: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_NAME: ${{ github.workflow }}
        shell: bash
        run: |
          set -euo pipefail

          validate_binding_traces() {
            local bindings_file="$1"
            local runs_file="$2"
            local required_obligations="$3"
            jq -e --argjson required "$required_obligations" --slurpfile runs "$runs_file" '
              . as $document
              | any($document.bindings[]; .suite == "SUITE-001")
              and all($required[];
                . as $obligation |
                any($document.bindings[];
                  .suite == "SUITE-001" and .obligation == $obligation
                )
              )
              and all($document.bindings[] | select(.suite == "SUITE-001");
                . as $binding |
                any($runs[0][];
                  .suite == "SUITE-001"
                  and any(.entries[];
                    . as $entry |
                    $entry.outcome == "pass"
                    and (($binding.symbols | index($entry.symbol)) != null)
                    and ((($entry.traceIds // []) | index($binding.obligation)) != null)
                  )
                )
              )
            ' "$bindings_file" >/dev/null
          }

          # BEGIN release-evidence status helper
          write_release_evidence_status() {
            local suite_exit_code="$1"
            local run_record_count="$2"
            local status_file="$3"
            local outcome=complete
            if [[ "$suite_exit_code" -ne 0 || "$run_record_count" -eq 0 ]]; then
              outcome=incomplete
            fi
            printf '{"schemaVersion":1,"suite":"SUITE-001","status":"%s","suiteExitCode":%s,"runRecordCount":%s}\n' \
              "$outcome" "$suite_exit_code" "$run_record_count" > "$status_file"
          }
          # END release-evidence status helper

          test_dir="$RUNNER_TEMP/quoin-evidence-binding-test"
          mkdir -p "$test_dir"
          test_required='["FR-AC-1"]'
          jq -n '{schemaVersion:1,bindings:[{obligation:"FR-AC-1",suite:"SUITE-001",symbols:["tests::bound"]}]}' > "$test_dir/bindings.json"
          jq -n '{schemaVersion:1,suite:"SUITE-001",evidenceKind:"Unit",entries:[{symbol:"tests::bound",outcome:"pass",traceIds:["FR-OTHER"]},{symbol:"tests::unrelated",outcome:"pass",traceIds:["FR-AC-1"]}]}' > "$test_dir/unrelated-run.json"
          jq -s . "$test_dir/unrelated-run.json" > "$test_dir/unrelated-runs.json"
          if validate_binding_traces "$test_dir/bindings.json" "$test_dir/unrelated-runs.json" "$test_required"; then
            echo "::error::evidence validator accepted a passing test without the bound obligation trace" >&2
            exit 1
          fi

          jq -n '{schemaVersion:1,suite:"SUITE-001",evidenceKind:"Unit",entries:[{symbol:"tests::bound",outcome:"pass",traceIds:["FR-AC-1"]},{symbol:"tests::unrelated",outcome:"pass",traceIds:["FR-AC-1"]}]}' > "$test_dir/matching-run.json"
          jq -s . "$test_dir/matching-run.json" > "$test_dir/matching-runs.json"
          validate_binding_traces "$test_dir/bindings.json" "$test_dir/matching-runs.json" "$test_required" || {
            echo "::error::evidence validator rejected a passing bound symbol with its obligation trace" >&2
            exit 1
          }

          required_obligations='["FR-186-AC-1","FR-186-AC-2","FR-186-AC-3","FR-186-AC-4","FR-186-AC-5","FR-186-AC-6","FR-186-AC-7","FR-186-AC-8"]'
          mkdir -p spec/evidence
          run_start_marker="$RUNNER_TEMP/quoin-suite-001-start"
          touch "$run_start_marker"
          suite_exit_code=0
          if make evidence; then
            :
          else
            suite_exit_code=$?
            echo "::warning::SUITE-001 run failed; retaining its run attempt as incomplete evidence" >&2
          fi

          bindings=spec/evidence/bindings.json
          jq -e '.schemaVersion == 1 and (.bindings | type == "array")' "$bindings" >/dev/null || {
            echo "::error::no_retained_evidence_store: evidence bindings are invalid" >&2
            exit 1
          }

          mapfile -t records < <(find spec/evidence/runs/SUITE-001 -type f -name '*.json' -newer "$run_start_marker" -print 2>/dev/null)
          for record in "${records[@]}"; do
            jq -e '.schemaVersion == 1 and .suite == "SUITE-001" and .evidenceKind == "Unit" and (.entries | type == "array" and length > 0)' "$record" >/dev/null || {
              echo "::error::no_retained_evidence_store: a current-job SUITE-001 run record is invalid" >&2
              exit 1
            }
          done

          write_release_evidence_status "$suite_exit_code" "${#records[@]}" spec/evidence/release-evidence-status.json
          if [[ "$suite_exit_code" -eq 0 && "${#records[@]}" -gt 0 ]]; then
            current_runs="$RUNNER_TEMP/quoin-evidence-current-runs.json"
            jq -s . "${records[@]}" > "$current_runs"
            if ! validate_binding_traces "$bindings" "$current_runs" "$required_obligations"; then
              echo "::error::complete SUITE-001 run lacks a passing FR-186-AC-1 through FR-186-AC-8 binding" >&2
              exit 1
            fi
          else
            echo "::warning::release evidence artifact will identify SUITE-001 as incomplete" >&2
          fi

          # quoin matrix invokes the quire matrix engine at this tagged checkout.
          matrix_file="$RUNNER_TEMP/quoin-release-test-matrix.json"
          rust/target/debug/quoin matrix --repo . --json > "$matrix_file"
          jq -e '
            (.requirements | type == "array" and length > 0)
            and ([.requirements[].criteria[] | select(.status != "retired")] | length > 0)
          ' "$matrix_file" >/dev/null || {
            echo "::error::Quire matrix is missing or has no active criteria" >&2
            exit 1
          }

          full_matrix="$RUNNER_TEMP/quoin-release-complete-matrix.json"
          jq -S -c '[.requirements[] | {document, id, criteria}]' "$matrix_file" > "$full_matrix"
          active_matrix_count=$(jq '[.[] | .criteria[] | select(.status != "retired")] | length' "$full_matrix")
          test "$active_matrix_count" -gt 0 || {
            echo "::error::complete Quire matrix contains no active obligations" >&2
            exit 1
          }

          expected_tag="${EXPECTED_TAG#refs/tags/}"
          [[ "$TAG_NAME" == "$expected_tag" ]] || {
            echo "::error::tag name does not match the reusable workflow input" >&2
            exit 1
          }
          resolved_revision=$(git rev-parse HEAD)
          [[ "$resolved_revision" == "$SOURCE_REVISION" ]] || {
            echo "::error::checked-out source does not match the tag workflow revision" >&2
            exit 1
          }

          record_path="spec/evidence/runs/SUITE-001/missing.json"
          run_sha256=null
          if [[ "${#records[@]}" -gt 1 ]]; then
            echo "::error::ambiguous current-job SUITE-001 run records" >&2
            exit 1
          elif [[ "${#records[@]}" -eq 1 ]]; then
            record_path="${records[0]}"
            test -f "$record_path" || {
              echo "::error::current-job run record disappeared before provenance creation" >&2
              exit 1
            }
            run_sha256=$(sha256sum "$record_path" | cut -d ' ' -f 1)
          fi

          test -f spec/evidence/suites.md || {
            echo "::error::suite declarations are missing from the tagged source" >&2
            exit 1
          }
          suite_declarations_sha256=$(sha256sum spec/evidence/suites.md | cut -d ' ' -f 1)
          run_sha_json=$(jq -cn --arg sha "$run_sha256" 'if $sha == "null" then null else $sha end')
          runs_json=$(jq -cn --arg path "$record_path" --argjson sha "$run_sha_json" \
            '[{suite:"SUITE-001",recordPath:$path,sha256:$sha}]')
          payload_file="$RUNNER_TEMP/execution-provenance.payload.json"
          jq -S -c -n \
            --arg revision "$resolved_revision" \
            --arg suite_sha "$suite_declarations_sha256" \
            --slurpfile matrix "$full_matrix" \
            --argjson runs "$runs_json" \
            '{version:2,sourceRevision:$revision,suiteDeclarationsSha256:$suite_sha,testMatrix:$matrix[0],runs:$runs}' \
            > "$payload_file"
          payload_fields=$(jq -c 'keys' "$payload_file")
          expected_payload_fields='["runs","sourceRevision","suiteDeclarationsSha256","testMatrix","version"]'
          test "$payload_fields" = "$expected_payload_fields" || {
            echo "::error::execution provenance payload has an unexpected field set" >&2
            exit 1
          }
          test "$(jq -r .version "$payload_file")" = 2 || {
            echo "::error::execution provenance payload version is not 2" >&2
            exit 1
          }
          jq -S -c '[.requirements[] | {document, id, criteria}]' "$matrix_file" \
            > "$RUNNER_TEMP/quoin-release-matrix-recheck.json"
          cmp "$full_matrix" "$RUNNER_TEMP/quoin-release-matrix-recheck.json" || {
            echo "::error::execution provenance matrix omits or changes active Quire criteria" >&2
            exit 1
          }
          jq -S -c '.testMatrix' "$payload_file" > "$RUNNER_TEMP/quoin-release-payload-matrix.json"
          cmp "$full_matrix" "$RUNNER_TEMP/quoin-release-payload-matrix.json" || {
            echo "::error::execution provenance payload omits or changes Quire matrix criteria" >&2
            exit 1
          }
          if [[ "$run_sha256" != null ]]; then
            test -f "$record_path" || {
              echo "::error::non-null SUITE-001 digest has no referenced run bytes" >&2
              exit 1
            }
            actual_sha=$(sha256sum "$record_path" | cut -d ' ' -f 1)
            [[ "$actual_sha" == "$run_sha256" ]] || {
              echo "::error::SUITE-001 run-record digest mismatch" >&2
              exit 1
            }
          else
            test ! -e "$record_path" || {
              echo "::error::missing-run null digest conflicts with an existing referenced record" >&2
              exit 1
            }
          fi

          provenance_dir=spec/evidence
          payload_type=application/vnd.agent-ix.execution-provenance.v2+json
          sign_dsse_payload() {
            local payload="$1" payload_type="$2" envelope="$3" bundle="$4" stem="$5"
            local pae="$RUNNER_TEMP/$stem.pae" payload_length type_length signature
            payload_length=$(wc -c < "$payload" | tr -d ' ')
            type_length=${#payload_type}
            { printf 'DSSEv1 %s %s %s ' "$type_length" "$payload_type" "$payload_length"; cat "$payload"; } > "$pae"
            cosign sign-blob --yes "$pae" --bundle "$bundle"
            signature=$(jq -er '.messageSignature.signature' "$bundle")
            jq -S -c -n \
              --arg payload_type "$payload_type" \
              --arg payload "$(base64 < "$payload" | tr -d '\r\n')" \
              --arg signature "$signature" \
              '{payloadType:$payload_type,payload:$payload,signatures:[{keyid:"",sig:$signature}]}' \
              > "$envelope"
          }
          sign_dsse_payload "$payload_file" "$payload_type" \
            "$provenance_dir/execution-provenance.dsse.json" \
            "$provenance_dir/execution-provenance.sigstore.json" execution-provenance

          identity_payload="$RUNNER_TEMP/release-evidence-identity.payload.json"
          jq -S -c -n \
            --arg tag "$TAG_NAME" \
            --arg source "$resolved_revision" \
            --arg run "$WORKFLOW_RUN_ID" \
            --arg attempt "$WORKFLOW_RUN_ATTEMPT" \
            --arg workflow "$WORKFLOW_NAME" \
            '{tagName:$tag,sourceRevision:$source,workflowRun:{id:$run,attempt:$attempt,workflow:$workflow}}' \
            > "$identity_payload"
          sign_dsse_payload "$identity_payload" \
            application/vnd.agent-ix.release-evidence-identity.v1+json \
            "$provenance_dir/release-evidence-identity.dsse.json" \
            "$provenance_dir/release-evidence-identity.sigstore.json" release-evidence-identity
          test -s "$provenance_dir/execution-provenance.dsse.json"
          test -s "$provenance_dir/execution-provenance.sigstore.json"
          test -s "$provenance_dir/release-evidence-identity.dsse.json"
          test -s "$provenance_dir/release-evidence-identity.sigstore.json"
      - uses: actions/upload-artifact@v7
        with:
          name: release-evidence
          path: spec/evidence/
          if-no-files-found: error
