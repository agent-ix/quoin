# Publishes @agent-ix/semantic-module-tools (packages/semantic-module-tools) to
# public npm via OIDC Trusted Publishing: no NPM_TOKEN. Filename is
# load-bearing: npmjs's Trusted Publisher for the package is bound to a
# workflow literally named `release-semantic-module-tools.yml`.
name: Release semantic-module-tools to npm

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for npm Trusted Publishing (public npm)

jobs:
  publish-npm:
    name: Test and publish to npm
    runs-on: ubuntu-24.04
    # An npm publish is irreversible (a version can never be re-published),
    # so this only ever runs from reviewed main, never from a branch or a
    # fork's workflow_dispatch.
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/semantic-module-tools
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22.15.0
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs a recent npm; the one bundled with Node 22
      # predates it.
      - name: Install current npm
        run: npm install -g npm@latest

      - name: Test
        run: npm test

      - name: Refuse an already-published version
        shell: bash
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version > /dev/null 2>&1; then
            echo "::error::${name}@${version} is already published to npm; bump package.json's version" >&2
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public
