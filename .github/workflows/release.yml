# Repackages an already-published, already-smoked GitHub Release into npm
# packages. Only `native-release.yml` builds the shipping binary. This
# workflow builds a separate acceptance checker, downloads the release its
# `tag` input names, and verifies each asset against that release's
# own `quoin-update-manifest.json`, and hands the verified archives to the
# shared `agent-ix/nodejs-actions/publish-native-npm` action, which owns the
# npm package layout and the `npm publish` calls. The npm version always
# equals the tag with its leading `v` stripped — there is no independent npm
# version counter. Filename is load-bearing: npmjs's Trusted Publisher for
# `@agent-ix/quoin` is bound to a workflow literally named `release.yml`.
name: Release to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing GitHub Release tag to repackage, e.g. vX.Y.Z"
        required: true
        type: string
      publish:
        description: "Publish to public npm. Leave false for a dry run (package + verify only)."
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # OIDC token for npm Trusted Publishing (public npm)

jobs:
  publish-npm:
    name: Repackage and publish to npm
    runs-on: ubuntu-24.04
    # An npm publish is irreversible (a version can never be re-published),
    # so this only ever runs from reviewed main, never from a branch or a
    # fork's workflow_dispatch.
    if: github.ref == 'refs/heads/main'
    # A hung step otherwise blocks for GitHub's 6-hour default.
    timeout-minutes: 20
    steps:
      # Needed for LICENSE, which the npm packages carry.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22.15.0
      - name: Download the release
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -D release
          test -f release/quoin-update-manifest.json

      - name: Compute the npm version
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Verify the release manifest
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg v "$VERSION" \
            '.schema_version == 2 and .version == $v and (.artifacts | length == 4)' \
            release/quoin-update-manifest.json > /dev/null

      - name: Extract release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          artifacts_file="$(mktemp)"
          jq -c '.artifacts[]' release/quoin-update-manifest.json > "$artifacts_file"

          while IFS= read -r artifact; do
            target=$(jq -r '.target' <<<"$artifact")
            asset=$(jq -r '.asset' <<<"$artifact")
            archive=$(jq -r '.archive' <<<"$artifact")

            file="release/$asset"
            test -f "$file"

            dest="artifacts/$target"
            mkdir -p "$dest"
            case "$archive" in
              tar-gz)
                tar -C "$dest" -xzf "$file"
                ;;
              zip)
                unzip -q -o "$file" -d "$dest"
                ;;
              *)
                echo "::error::$asset names an unrecognised archive kind: $archive" >&2
                exit 1
                ;;
            esac

            count=$(find "$dest" -maxdepth 1 -type f | wc -l | tr -d ' ')
            if [ "$count" != "1" ]; then
              echo "::error::expected exactly one file in $dest, found $count" >&2
              exit 1
            fi
          done < "$artifacts_file"

      - name: Verify the linux-x64 binary reports the published version
        shell: bash
        run: |
          set -euo pipefail
          chmod +x artifacts/x86_64-unknown-linux-gnu/quoin
          actual_version="$(artifacts/x86_64-unknown-linux-gnu/quoin --version)"
          if [ "$actual_version" != "$VERSION" ]; then
            echo "::error::artifacts/x86_64-unknown-linux-gnu/quoin --version printed '$actual_version', expected '$VERSION'; refusing to publish (e.g. a -dirty build)" >&2
            exit 1
          fi

      - name: Package and publish the npm distribution
        uses: agent-ix/nodejs-actions/publish-native-npm@main
        with:
          package: "@agent-ix/quoin"
          binary: quoin
          version: ${{ env.VERSION }}
          artifacts-dir: artifacts
          repository: ${{ github.repository }}
          description: "Quoin: author validated, traceable ISO/IEC/IEEE 29148-aligned specs, then plan and build against them (native binary)."
          self-update-command: update
          publish: ${{ inputs.publish }}

  smoke-npm:
    name: Smoke npm install on ${{ matrix.target }}
    needs: publish-npm
    if: inputs.publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
            native-package: quoin-linux-x64
            linux: true
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            native-package: quoin-linux-arm64
            linux: true
          - runner: macos-15
            target: darwin-arm64
            native-package: quoin-darwin-arm64
            linux: false
          - runner: windows-2025
            target: win32-x64
            native-package: quoin-win32-x64
            linux: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        if: matrix.target == 'linux-x64'
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Build the workflow smoke checker
        if: matrix.target == 'linux-x64'
        shell: bash
        working-directory: rust
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install
          test -n "$REGISTRY_TOKEN" || { echo "::error::REGISTRY_TOKEN must read private Rust build dependencies" >&2; exit 1; }
          git config --global url."https://x-access-token:${REGISTRY_TOKEN}@github.com/".insteadOf "https://github.com/"
          cleanup() {
            git config --global --unset-all "url.https://x-access-token:${REGISTRY_TOKEN}@github.com/.insteadOf" || true
          }
          trap cleanup EXIT
          cargo build --locked --target-dir target -p quoin-workflow-check
      - name: Install and verify the published package on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          NATIVE_PACKAGE: ${{ matrix.native-package }}
          LINUX_PACKAGE: ${{ matrix.linux }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PREFIX="$RUNNER_TEMP/quoin-smoke"
          mkdir -p "$PREFIX"
          NPMRC="$(mktemp)"
          printf '@agent-ix:registry=https://registry.npmjs.org/\n' > "$NPMRC"
          attempt=0
          max_attempts=8
          until npm install --global --prefix "$PREFIX" --userconfig "$NPMRC" \
            --registry=https://registry.npmjs.org/ "@agent-ix/quoin@${VERSION}"; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::npm install of @agent-ix/quoin@${VERSION} did not succeed after $attempt attempts" >&2
              exit 1
            fi
            sleep 15
          done

          actual_version="$("$PREFIX/bin/quoin" --version)"
          if [ "$actual_version" != "$VERSION" ]; then
            echo "::error::quoin --version printed '$actual_version', expected '$VERSION'" >&2
            exit 1
          fi

          if [ "$LINUX_PACKAGE" = true ]; then
            package_json="$PREFIX/lib/node_modules/@agent-ix/$NATIVE_PACKAGE/package.json"
            test -f "$package_json"
            node - "$package_json" <<'NODE'
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (JSON.stringify(pkg.libc) !== JSON.stringify(["glibc"])) {
            throw new Error(`${pkg.name} libc must be ["glibc"], got ${JSON.stringify(pkg.libc)}`);
          }
          NODE
          fi

          if [ "$TARGET" = linux-x64 ]; then
            npm install --global --prefix "$PREFIX" --userconfig "$NPMRC" \
              --registry=https://registry.npmjs.org/ @agent-ix/ix-flow@0.3.4
            rust/target/debug/quoin-workflow-check smoke \
              "$PREFIX/bin/quoin" \
              "$PREFIX/lib/node_modules/@agent-ix/ix-flow/bin/ix-flow.js" \
              "$GITHUB_WORKSPACE"
          fi
          "$PREFIX/bin/quoin" update 2>update.err && {
            echo "::error::quoin update exited 0 under an npm install; it must defer to npm instead" >&2
            exit 1
          }
          grep -q "npm install -g @agent-ix/quoin@latest" update.err

      - name: Install and verify the published package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
          NATIVE_PACKAGE: ${{ matrix.native-package }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:TAG -replace '^v', ''
          $prefix = Join-Path $env:RUNNER_TEMP 'quoin-smoke'
          $npmrc = Join-Path $env:RUNNER_TEMP 'quoin-smoke.npmrc'
          Set-Content -Path $npmrc -Value '@agent-ix:registry=https://registry.npmjs.org/'
          $installed = $false
          for ($attempt = 1; $attempt -le 8; $attempt++) {
            npm install --global --prefix $prefix --userconfig $npmrc --registry=https://registry.npmjs.org/ "@agent-ix/quoin@$version"
            if ($LASTEXITCODE -eq 0) { $installed = $true; break }
            if ($attempt -lt 8) { Start-Sleep -Seconds 15 }
          }
          if (-not $installed) { throw 'npm install failed after 8 attempts' }

          $quoin = Join-Path $prefix 'quoin.cmd'
          $actualVersion = (& $quoin --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualVersion -ne $version) {
            throw "quoin --version printed '$actualVersion', expected '$version'"
          }
          & $quoin update 2> (Join-Path $env:RUNNER_TEMP 'update.err')
          if ($LASTEXITCODE -eq 0) { throw 'quoin update must defer to npm under an npm install' }
          if (-not (Select-String -Path (Join-Path $env:RUNNER_TEMP 'update.err') -Pattern 'npm install -g @agent-ix/quoin@latest')) {
            throw 'quoin update stderr did not name the npm command to run'
          }
