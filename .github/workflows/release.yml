name: Release

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for npm Trusted Publishing (no-op for token-based GH Packages)

jobs:
  ci:
    uses: agent-ix/nodejs-actions/.github/workflows/release.yml@5f1eb92b20aaac54dc8dff180e3d19adfd1a08ea
    with:
      npm_registry: https://registry.npmjs.org
      trusted_publish: true
