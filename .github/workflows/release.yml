# Locally-explicit release pipeline (same reasoning as build-test.yml, CR-129).
# The shared agent-ix/nodejs-actions release workflow runs bare `make test`,
# which is now the governed verification stack and requires sibling source
# checkouts the reusable job cannot provide — its test leg can never pass here.
# This workflow runs the same content-addressed gates as canonical CI, then
# publishes the exact tagged version via npm Trusted Publishing (OIDC), from a
# workflow named release.yml as Trusted Publishing requires.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.15.0
          cache: pnpm
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: agent-ix/quire-cli
          ref: bcface2714a958a328f3427714650ab2df71030f
          path: .ci/quire-cli
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.94.1
      - name: Require private transitive dependency token
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: test -n "$REGISTRY_TOKEN" || { echo "::error::REGISTRY_TOKEN must read private ix-trace-rs"; exit 1; }
      - name: Authenticate private Cargo sources
        run: git config --global url."https://x-access-token:${{ secrets.REGISTRY_TOKEN }}@github.com/".insteadOf "https://github.com/"
      # While the rewrite is active: qa-corpus is private, and the corpus tests
      # read it in place at the locked submodule revision.
      - name: Fetch pinned qa-corpus submodule
        run: git submodule update --init corpus
      - name: Build exact governed Quire source
        run: cargo build --locked --release --manifest-path .ci/quire-cli/Cargo.toml
      - name: Report governed Quire identity
        run: .ci/quire-cli/target/release/quire --version
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      # Default modules include the private engineering-assurance repo, so the
      # one networked install must happen while the rewrite is active. The
      # in-gate reconcile is then offline by contract (NFR-001, IT-001-SC-03).
      - name: Install pinned default modules
        run: |
          make build
          node bin/quoin.js module ensure-defaults
      # battletest's declaration-route guard demands exact https://github.com/
      # routes; leaving the credential rewrite active fails it by design.
      - name: Drop the credential rewrite before governed tests
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: git config --global --remove-section url."https://x-access-token:${REGISTRY_TOKEN}@github.com/"
      # Make's validation and contract gates intentionally refuse a PATH-only
      # Quire. Build the exact source revision above: the published npm 0.30.2
      # wrapper predates source provenance and fails the current contract even
      # though its package version looks current.
      - name: Test with exact governed Quire
        run: make test-with-quire QUIRE="$GITHUB_WORKSPACE/.ci/quire-cli/target/release/quire"

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.15.0
          cache: pnpm
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - run: make lint

  audit:
    name: Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.15.0
          cache: pnpm
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies at high severity
        run: pnpm audit --audit-level=high --prod

  publish:
    name: Publish
    runs-on: ubuntu-24.04
    needs: [test, lint, audit]
    permissions:
      contents: read
      id-token: write # OIDC token for npm Trusted Publishing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # full history + tags so `git describe --exact-match` works
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.15.0
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # Trusted Publishing (OIDC) needs npm >= 11.5.1; runner images lag, and
      # npm@latest is npm 12, which requires node >= 22.22.2 — newer than the
      # exact pinned node. Pin the newest npm 11 (engines: node >= 22.9.0).
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@11.19.1
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Build
        run: make build
      # Only an exact tag releases, and it releases exactly its own version.
      # No auto-bump: a version collision means the tag ritual was wrong, and
      # publishing a number no tag names would break tag->artifact provenance.
      - name: Publish exact tagged version
        run: |
          set -euo pipefail
          TAG=$(git describe --tags --exact-match)
          VERSION="${TAG#v}"
          PKG=$(node -p "require('./package.json').name")
          if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$PKG@$VERSION is already published; cut a new tag instead"
            exit 1
          fi
          jq --arg v "$VERSION" '.version=$v' package.json > package.json.tmp
          mv package.json.tmp package.json
          npm publish --access public
