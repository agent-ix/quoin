# Default Filament module set shipped with quoin.
#
# Lazily installed into ~/.ix/filament/modules on first catalog access (see
# src/modules.ts). Each entry resolves a module from its published npm package
# (@agent-ix/<name>) at a pinned version — the package tarball root IS the module
# (manifest.yaml at the top). This file is the canonical source of truth for the
# module set + pins.
#
# NOTE: these npm pins require the corresponding @agent-ix/spec-* packages to be
# published at the pinned versions. Bump a `version` here only after that version
# is live on npm; otherwise lazy default reconcile fails to resolve.
schemaVersion: 1
name: quoin-default-modules
entries:
  - name: spec-artifacts-iso
    version: "0.6.0"
    defaultEnabled: true
    source:
      type: npm
      package: "@agent-ix/spec-artifacts-iso"
      version: "0.6.0"

  - name: spec-artifacts-app
    version: "0.4.0"
    defaultEnabled: true
    source:
      type: npm
      package: "@agent-ix/spec-artifacts-app"
      version: "0.4.0"

  - name: spec-artifacts-process
    version: "0.6.0"
    defaultEnabled: true
    source:
      type: npm
      package: "@agent-ix/spec-artifacts-process"
      version: "0.6.0"

  - name: spec-objects-business
    version: "0.5.0"
    defaultEnabled: true
    source:
      type: npm
      package: "@agent-ix/spec-objects-business"
      version: "0.5.0"

  - name: spec-objects-architecture
    version: "0.5.0"
    defaultEnabled: true
    source:
      type: npm
      package: "@agent-ix/spec-objects-architecture"
      version: "0.5.0"

  - name: spec-objects-enterprise
    version: "0.4.0"
    defaultEnabled: true
    source:
      type: npm
      package: "@agent-ix/spec-objects-enterprise"
      version: "0.4.0"

  - name: spec-objects-operational
    version: "0.5.0"
    defaultEnabled: true
    source:
      type: npm
      package: "@agent-ix/spec-objects-operational"
      version: "0.5.0"

  - name: spec-objects-security
    version: "0.4.0"
    defaultEnabled: true
    source:
      type: npm
      package: "@agent-ix/spec-objects-security"
      version: "0.4.0"
