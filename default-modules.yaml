# Default Filament module set shipped with quoin.
#
# Lazily installed into ~/.ix/filament/modules on first catalog access. Each
# entry checks out one module's data subdirectory from its repository's
# default branch.
schemaVersion: 1
name: quoin-default-modules
entries:
  # Assurance artifacts are available by default but remain opt-in: installing
  # their vocabulary does not require a repository to author any assurance
  # document.
  - name: engineering-assurance
    defaultEnabled: true
    source:
      type: git-subdir
      url: agent-ix/engineering-assurance
      path: engineering_assurance

  - name: spec-artifacts-iso
    defaultEnabled: true
    source:
      type: git-subdir
      url: agent-ix/spec-artifacts-iso
      path: spec_artifacts_iso

  - name: spec-artifacts-app
    defaultEnabled: true
    source:
      type: git-subdir
      url: agent-ix/spec-artifacts-app
      path: spec_artifacts_app

  - name: spec-artifacts-process
    defaultEnabled: true
    source:
      type: git-subdir
      url: agent-ix/spec-artifacts-process
      path: spec_artifacts_process

  - name: spec-objects-business
    defaultEnabled: true
    source:
      type: git-subdir
      url: agent-ix/spec-objects-business
      path: spec_objects_business

  - name: spec-objects-architecture
    defaultEnabled: true
    source:
      type: git-subdir
      url: agent-ix/spec-objects-architecture
      path: spec_objects_architecture

  - name: spec-objects-enterprise
    defaultEnabled: true
    source:
      type: git-subdir
      url: agent-ix/spec-objects-enterprise
      path: spec_objects_enterprise

  - name: spec-objects-operational
    defaultEnabled: true
    source:
      type: git-subdir
      url: agent-ix/spec-objects-operational
      path: spec_objects_operational

  - name: spec-objects-security
    defaultEnabled: true
    source:
      type: git-subdir
      url: agent-ix/spec-objects-security
      path: spec_objects_security

  - name: spec-objects-safety
    defaultEnabled: true
    source:
      type: git-subdir
      url: agent-ix/spec-objects-safety
      path: spec_objects_safety
