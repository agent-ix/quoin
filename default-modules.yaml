# Default Filament module set shipped with quoin.
#
# Lazily installed into ~/.ix/filament/modules on first catalog access (see
# src/modules.ts). Each entry sparse-checks out one module's data subdir from its
# canonical repo at a pinned tag — the same git tag the Python wheel is built
# from. This file is the canonical-ready source of truth for the module set +
# pins (a future generator can derive the backend pyproject pins / activation
# list from it).
schemaVersion: 1
name: quoin-default-modules
entries:
  # Assurance artifacts are available by default but remain opt-in: installing
  # their vocabulary does not require a repository to author any assurance
  # document. `ref` is the commit engineering-assurance's v0.4.0 tag names,
  # which is what FR-016 requires of an entry whose module this repository's
  # Rust workspace also consumes: `git-subdir` resolves `ref` at install time,
  # and `rust/Cargo.toml` pins the crate by commit, so naming the same commit
  # here is what makes the schemas installed and the verdict logic compiled
  # resolve to one tree. The other entries pin their release tag, which is
  # FR-016's default and is enough where there is no second half to agree with.
  # It must stay a commit reachable from upstream's published history — the
  # first-integration pin 2a66359 was orphaned when that history was rebuilt,
  # upload-pack refused it, and clean-room installs failed while
  # already-installed dev machines stayed green (agent-ix/quoin#308, caught by
  # the v0.22.1 release run).
  #
  # This pin and `rust/Cargo.toml`'s `engineering-assurance` dependency are two
  # halves of one version and must move together (PLAT-1032). The crate decides
  # measurement verdicts; this module carries the schemas that validate
  # AssuranceProfile and MeasurementPlan frontmatter. Leaving this at 0.2.0
  # while the crate moved to 0.4.0 made quoin's own spec/assurance/AP-201 and
  # AP-202 unvalidatable against the module quoin ships, because v0.4.0 renamed
  # `profile_version` to `schema_version` under `additionalProperties: false`.
  - name: engineering-assurance
    version: "0.4.0"
    defaultEnabled: true
    source:
      type: git-subdir
      url: agent-ix/engineering-assurance
      path: engineering_assurance
      ref: 438b30fcd5d4df457fe0fca4682b322c72856c1c

  - name: spec-artifacts-iso
    version: "0.19.0"
    defaultEnabled: true
    source:
      type: git-subdir
      url: agent-ix/spec-artifacts-iso
      path: spec_artifacts_iso
      ref: v0.19.0

  - name: spec-artifacts-app
    version: "0.6.0"
    defaultEnabled: true
    source:
      type: git-subdir
      url: agent-ix/spec-artifacts-app
      path: spec_artifacts_app
      ref: v0.6.0

  - name: spec-artifacts-process
    version: "0.26.0"
    defaultEnabled: true
    source:
      type: git-subdir
      url: agent-ix/spec-artifacts-process
      path: spec_artifacts_process
