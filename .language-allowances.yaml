# Language-boundary exception manifest
#
# THE RULE: every file in this repository that runs code should be Rust.
#
# Applied literally that rule is wrong — it would flag the lint config, the
# agent skills and the test fixtures, none of which are engine logic and none
# of which anyone intends to convert. So the rule ships with a named list of
# exceptions, and this file is that list.
#
# A non-Rust file that runs code is a VIOLATION unless it matches exactly one
# category below. Matching two is an authoring error, not a stronger claim.
#
# One category is deliberately NOT here: staged-port retention (a file being
# converted, with a named successor ticket and an expiry). That lives in the
# burn-down matrix, because its whole purpose is to be a shrinking list, and a
# shrinking list belongs where it is counted rather than where it is declared.
# See docs/rust-burndown/executable-path-matrix.md.
#
# Governing policy:
#   quire-research/implementation-language-policy.md, Amendment 1 (2026-09-12),
#   section "Containment and burn-down are two programs".
#
# THIS FILE IS MEANT TO BE COPIED. It is the first one in the ecosystem. The
# categories below are written as general rules that hold in any repository;
# only `paths` is repo-specific. When you copy it, change the paths and the
# repo-specific notes, not the category definitions.

version: 1
repo: agent-ix/quoin

categories:
  - id: ui
    rule: >
      User-interface code. Standing-approved as a target language, not debt.
    reason: >
      UI is written in the language its framework is written in. This is a
      permanent approval, not a deferral.
    authority: implementation-language-policy.md § Required boundary
    paths: []
    note: quoin ships no UI. The category is retained so a copy of this file starts complete.

  - id: generated
    rule: >
      Code emitted by a generator, identified by GENERATOR PROVENANCE — the
      generator's identity and the digest of the source it was generated from.
    reason: >
      The source is the artifact under language governance; the output is a
      build product of it.
    authority: implementation-language-policy.md § Containment and burn-down
    forfeits_if: >
      Hand-edited. A hand-edit makes the file source, and source is governed.
      This is why the category keys on provenance and not on a directory named
      "generated" — a directory name is a claim, a digest is a check.
    requires:
      - generator_identity
      - source_digest
    paths: []
    note: >
      quoin has no file that can claim this today. tests/props/*.prop.test.ts
      names a generator ("generated by the spec-correctness skill") but records
      no source digest and is hand-maintainable, so it is governed as ordinary
      source. The vendored skill bundles cannot claim it either — see #374.

  - id: inert
    rule: >
      Data and fixtures that determine no assertion. Includes foreign-language
      sample inputs and test corpora.
    reason: >
      A file the system reads is an input, not an implementation, even when its
      extension says otherwise.
    authority: implementation-language-policy.md § Existing tools and non-code artifacts
    test: >
      Would changing this file's LOGIC (not its data) change a pass/fail
      result? If yes it is not inert.
    paths:
      - path: corpus/cases/**
        note: >
          Foreign-language sample inputs in the qa-corpus submodule.
          .rs 906 / .ts 613 / .py 525 / .sh 36 lines across 162 files.
        disposition: owner ruling 2026-09-12
      - path: corpus/**
        note: >
          Owner ruling 2026-09-12: qa-corpus is a test corpus and is OUT OF
          SCOPE in full. bounds.py, verify.py and corpus/scripts/*.py stay
          Python indefinitely, and no conversion row is opened against them by
          the burn-down or by containment — even though quoin's own gate
          executes bounds.py. A test corpus written in the languages it tests
          is the corpus working correctly.
        disposition: owner ruling 2026-09-12

  - id: host-dispatch
    rule: >
      A thin shim that hands control to the real implementation and does
      nothing else, under a declared line and branch ceiling.
    reason: >
      Some host contracts (a node bin stub, a plugin hook) must exist in the
      host's language. The ceiling is what stops "thin shim" becoming a place
      to hide logic.
    authority: implementation-language-policy.md § Containment and burn-down
    ceiling:
      lines: 40
      branches: 2
    paths:
      - path: bin/quoin.js
        lines: 21
        note: npm entrypoint declared in package.json `bin`.
      - path: src/hooks/command-not-found.ts
        lines: 31
        note: >
          oclif `command_not_found` hook declared in package.json
          `oclif.hooks`. Removing it is a published-extension contract change.

  - id: tool-config
    rule: >
      Build, lint, test-runner and eval-harness configuration.
    reason: >
      Tooling config is written in whatever the tool reads. It configures the
      build; it is not the thing being built. General category by owner ruling
      — every repository has these files and the ruling is not repeated per
      file or per repo.
    authority: owner ruling 2026-09-12 (quoin#373 F-2)
    boundary: >
      Configuration only. A config file that grows engine logic is engine
      logic, and the reviewer's question is whether the file would still be
      recognisable as configuration to the tool that reads it.
    paths:
      - path: vite.config.ts
        lines: 200
      - path: cli-agent-evals.config.mjs
        lines: 54
      - path: eslint.config.js
        lines: 27

  - id: agent-skills
    rule: >
      Agent skills and their runtime assets.
    reason: >
      Skills are authored for an agent host that loads markdown and JavaScript.
      They are not written in Rust and are not intended to be. General category
      by owner ruling.
    authority: owner ruling 2026-09-12 (quoin#373 F-1)
    boundary: >
      This exempts skills from the LANGUAGE rule only. It exempts nothing else
      — see #374, a supply-chain defect in exactly these paths that stands on
      its own.
    paths:
      - path: skills/**
        lines: 23164
        note: >
          Includes skills/*/workflow-assets/dist/index.js, three byte-identical
          7,525-line vendored bundles. Exempt from conversion; tracked as a
          vendoring defect in #374.

  - id: schema-source
    rule: >
      Schema definition languages — TypeSpec, JSON Schema, OpenAPI and the like.
    reason: >
      Schemas are data. A schema is the single source a type is defined in, and
      the generated Rust/TS/Python forms of it are the implementation.
    authority: owner ruling 2026-09-12 (quoin#373 F-3)
    paths:
      - path: templates/semantic-module/{{cookiecutter.repo_name}}/typespec/main.tsp
        lines: 82

  - id: owner-disposition
    rule: >
      A specific path retained by a dated owner decision that fits no other
      category.
    reason: >
      An escape hatch that leaves a record. Every entry carries a date and the
      decision, so a reader can tell a decision from an oversight.
    authority: implementation-language-policy.md § Containment and burn-down
    paths: []
    note: >
      Empty by design. Prefer a general category over a per-path disposition;
      reach for this only when no general rule is true.

# --------------------------------------------------------------------------
# Enforcement requirements (quire-research LR08, #64)
#
# A check that reads this file must also:
#
#   - Walk paths that have no file extension to scan: Makefile recipes and
#     .github/workflows/** `run:` blocks. quoin has 36 such executable paths.
#   - Carry a BYPASS PROBE. A planted non-Rust semantic file in a non-allowed
#     path must fail, and a planted hand-edit of a `generated` file must fail
#     that category. Without the probe the check passes over an empty
#     population, which is not evidence.
#   - Emit the burn-down matrix as a byproduct of the check, not as a separate
#     script.
# --------------------------------------------------------------------------
