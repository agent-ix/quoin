# Language-boundary exception manifest — governed by NFR-024.
#
# THE RULE: every file in this repository that runs code should be Rust.
#
# Applied literally that rule is wrong — it would flag the lint config and the
# test fixtures, neither of which is engine logic and neither of which anyone
# intends to convert. So the rule ships with a named list of exceptions, and
# this file is that list.
#
# A non-Rust file that runs code is a VIOLATION unless it matches exactly one
# category below. Matching two is an authoring error, not a stronger claim.
#
# THE CATEGORIES ARE NFR-024's AND ONLY NFR-024's: `ui`, `generated`, `inert`,
# `thin-host`, `owner-disposition`. A category this file invents is not an
# exception — it is an unbacked classification, and NFR-024-AC-14 fails the run
# for it. That criterion exists because this manifest previously declared eight
# categories against NFR-024's five, and the three it invented covered 23,527
# lines that left the population without any requirement admitting them.
#
# STAGED-PORT RETENTION IS DELIBERATELY ABSENT. It is not a sixth category and
# must not be added as one. NFR-024 states this; it is repeated here
# because the absence otherwise reads as an omission and invites a sixth entry.
#
# The categories derive from NFR-024. These path decisions apply only to Quoin.

version: 1
repo: agent-ix/quoin
governed_by: NFR-024

categories:
  - id: ui
    rule: >
      User-interface code. Standing-approved as a target language, not debt.
    owner: quoin-maintainers
    paths: []
    note: quoin ships no UI. Retained so a copy of this file starts complete.

  - id: generated
    rule: >
      Code emitted by a generator, identified by generator provenance.
    owner: quoin-maintainers
    forfeits_if: >
      Hand-edited. A hand-edit makes the file source, and source is governed.
    paths: []

  - id: inert
    rule: >
      Data and fixtures that determine no assertion, including foreign-language
      sample inputs and test corpora.
    owner: quoin-maintainers
    test: >
      Would changing this file's LOGIC (not its data) change a pass/fail
      result? If yes it is not inert.
    paths:
      - path: corpus/cases/**
        owner: quoin-maintainers
        note: >
          Foreign-language sample inputs in the qa-corpus submodule. The
          submodule's executable tooling belongs to qa-corpus and is not an
          inert-sample allowance in Quoin. Quoin's native gate does not invoke
          the older pinned revision's bounds.py or verify.py.
      - path: skills/**/*.md
        owner: quoin-maintainers
        note: >
          Skill bodies are prose an agent host reads. They carry no executable
          extension and contribute nothing to the metric population; declared
          so the skills tree is not silently half-covered. Workflow definitions
          have an explicit owner disposition below; executable invariant
          decisions are implemented in Rust and are not covered by this entry.

  - id: thin-host
    rule: >
      A shim that hands control to the real implementation and does nothing
      else, under a declared line and branch ceiling.
    owner: quoin-maintainers
    ceiling:
      lines: 40
      branches: 2
    paths: []

  - id: owner-disposition
    rule: >
      A path retained by a dated owner decision that fits no other category.
    owner: quoin-maintainers
    requires: [date, deciding_owner]
    paths:
      - path: skills/**/workflows/**/def.yaml
        owner: quoin-maintainers
        date: 2026-10-24
        deciding_owner: kreneskyp
        note: >
          Owner selected Quoin-owned workflow definitions with ix-flow as the
          generic runner. Definitions are first-party Quoin source; invariant
          decisions and document validation execute in the Rust provider.
      - path: templates/semantic-module/{{cookiecutter.repo_name}}/typespec/main.tsp
        owner: quoin-maintainers
        date: 2026-09-12
        deciding_owner: kreneskyp
        note: >
          Owner ruling: schemas are data. Recorded here rather than under
          `inert` deliberately — the inert test is "determines no assertion",
          and this file compiles to the JSON Schemas the rendered module's
          Python tests then assert against, two hops downstream. Stretching
          `inert` to cover it is the move that put 23,164 asserting lines
          outside the population once already. Move it to `inert` only if the
          owner rules the two-hop chain does not count.

# --------------------------------------------------------------------------
# Enforcement requirements (quire-research LR08, #64; NFR-024-AC-5/8/12/14)
#
#   - Walk paths with no governed extension: Makefile recipes and
#     .github/workflows/** `run:` blocks. quoin has 36 such executable paths.
#   - Carry a BYPASS PROBE. A planted non-Rust semantic file in a non-allowed
#     path must fail, and a planted hand-edit of a `generated` file must fail
#     that category. Without the probe the check passes over an empty
#     population, which is not evidence.
#   - A run classifying an empty population is INCONCLUSIVE, never zero
#     violations.
#   - Fail on a manifest entry whose category NFR-024 does not admit.
# --------------------------------------------------------------------------
