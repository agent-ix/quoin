[package]
name = "quoin-semantic"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
description = "Semantic-module contract: manifest block, data_schema resolution, derived package manifest, legacy-form sweep (quoin FR-070/FR-073/FR-074/FR-075)."
license = "AGPL-3.0-or-later"
repository = "https://github.com/agent-ix/quoin"
publish = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
module_name_repetitions = "allow"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# YAML 1.1 (libyaml) reader for `manifest.yaml`. See DIVERGENCE.md §6 — the
# TypeScript reads YAML 1.2 via the `yaml` npm package and the two disagree on
# unquoted `no`/`yes`/`on`/`off` and on sexagesimals.
serde_norway = "0.9"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
# Exact pin. The error-*kind* enum is the surface the ajv-parity diagnostic
# mapping is written against, so a minor bump is a reviewable change, not a
# silent one. See DIVERGENCE.md §1 for why 0.56 rather than the 0.17/0.18 pins
# elsewhere in the ecosystem.
jsonschema = { version = "=0.56.0", default-features = false }

[dev-dependencies]
tempfile = "3"
