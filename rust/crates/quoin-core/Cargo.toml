[package]
name = "quoin-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The quoin engine boundary: one subprocess, JSON in on stdin, JSON out on stdout."
publish.workspace = true
default-run = "quoin-core"

[lib]
name = "quoin_core"
path = "src/lib.rs"

[[bin]]
name = "quoin-core"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
quoin-schemas = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# quoin does not grow its own syn-based source auditor: `source_audit` is the
# shared home for "is this library half actually I/O-free" (quire-research
# implementation-language-policy, "Shared tooling is consumed, not regrown").
engineering-assurance = { workspace = true }
