[package]
name = "quoin-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The quoin engine boundary: one subprocess, JSON in on stdin, JSON out on stdout."
publish.workspace = true
default-run = "quoin-core"

[lib]
name = "quoin_core"
path = "src/lib.rs"

[[bin]]
name = "quoin-core"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
quoin-assurance = { workspace = true }
# quoin#457, the Stage 9 cutover. `quoin-core` uses only the DECIDING half —
# sealing, verifying, lineage and the verification itself, all of which are
# pure functions over documents. The evidence STORE is the
# `ChangeAssuranceHost` seam, whose one production implementation is the
# crate's own `DiskEvidenceStore`, constructed in `main.rs`. Nothing under
# `ops/` opens a file; see `src/capabilities.rs`.
quoin-change-assurance = { workspace = true }
# quoin#446, the Stage 7 cutover. `quoin-core` uses only the FILESYSTEM-FREE
# half of these two crates — `resolve_org_from_documents`, `Source`,
# `MarketplaceManifest`, `ModuleRegistry` — plus the `GitResolver` and
# `SemanticGate` seams, which `main.rs` supplies. Nothing under `ops/` opens a
# file; see `src/capabilities.rs`.
quoin-config = { workspace = true }
# quoin#458, the Stage 9 cutover. `quoin-core` uses only the DECIDING half:
# `EvidenceSource` is the seam, and its only disk implementation
# (`DiskEvidence`) is constructed in `main.rs`. Nothing under `ops/` opens a
# file; see `src/capabilities.rs`.
quoin-evidence = { workspace = true }
# quoin#478, the Stage 6 wiring. Unlike the four domains above, `measurement`
# takes NO host trait: every one of its twelve routes opens a measurement
# store, and these two crates already own the seams that open it
# (`MeasurementSource`, `Clock`), unit-tested in-crate against
# `MemoryMeasurement`. A pass-through host here would be a second copy of the
# routing table. Nothing under `ops/measurement/` names a path API beyond
# `std::path`; see that module's header and `tests/tc_library_containment.rs`.
quoin-measurement = { workspace = true }
quoin-measurement-graph = { workspace = true }
quoin-modules = { workspace = true }
# The obligation vocabulary `evidence.record` binds against. quoin-core does not
# derive obligations — quire does, and the command layer passes them in — but
# the shape has to be the same one `quoin-evidence` matches on.
quoin-quire-types = { workspace = true }
# quoin#452, the Stage 8 cutover. `quoin-core` uses only the DECIDING half —
# the diagnostics, the block shape and the sweep report; the reading of the
# vendored contract tree and of the corpus is the `SemanticHost` seam, which
# `main.rs` supplies. Nothing under `ops/` opens a file; see
# `src/capabilities.rs`.
quoin-semantic = { workspace = true }
quoin-completeness = { workspace = true }
# The canonicalizer, the strict JSON reader, the digest domains and the store
# layout, all shared with `quoin-change-assurance` so that a payload cannot
# disagree with the digest taken over the same value (FR-100-CON-4).
quoin-store = { workspace = true }
quoin-validators = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Optional, and enabled by `quoin-schemas` rather than by this crate: the
# derives are what let the SCHEMA be read off the canonical type, but nothing
# on the boundary's own execution path needs them, so the shipped binary does
# not carry the generator's dependency tree.
schemars = { workspace = true, optional = true }

[features]
# FR-097. `quoin-schemas` turns this on to read the wire shapes off the types
# that actually serialise them, rather than off a second declaration of the
# same shapes. There is no `default` here on purpose: a feature that is on by
# default is a feature nobody ever proves works when it is off.
schema = [
    "dep:schemars",
    "quoin-assurance/schema",
    "quoin-completeness/schema",
    "quoin-evidence/schema",
    "quoin-modules/schema",
    "quoin-semantic/schema",
    "quoin-validators/schema",
]

[dev-dependencies]
# quoin does not grow its own syn-based source auditor: `source_audit` is the
# shared home for "is this library half actually I/O-free" (quire-research
# implementation-language-policy, "Shared tooling is consumed, not regrown").
engineering-assurance = { workspace = true }
# The reconcile re-validation test (quoin#446) drives the real binary against a
# real `~/.ix` home, because that path exists precisely to catch a module whose
# manifest changed on DISK after it was installed. Same pin as `quoin-modules`
# and `quoin-config` use for the same reason.
tempfile = "=3.27.0"
