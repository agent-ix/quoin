[package]
name = "quoin-dossier"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The dossier document registry, writer and export hand-off behind `quoin dossier` (quoin FR-191)."
publish.workspace = true

[lints]
workspace = true

[features]
# Registers the stub generators `stub-a`, `stub-b`, `stub-gaps`, `stub-fail`
# and `stub-time` so the command can be driven before any real document
# exists. Off in every shipped build; `quoin-cli` enables it for its tests
# through a dev-dependency.
test-stubs = []

[dependencies]
quoin-soup = { workspace = true }
quoin-anomaly = { workspace = true }
ix-cli-kit = { workspace = true }
quoin-assurance = { workspace = true }
quoin-quire = { workspace = true }
quoin-quire-types = { workspace = true }
quoin-risk-advice = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["parsing"] }

[dev-dependencies]
quoin-core = { workspace = true }
quoin-evidence = { workspace = true }
ix-trace-rs = { workspace = true }
