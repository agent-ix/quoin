#
# quoin-evidence — the evidence store and its producer adapters (quoin#456,
# parent quoin#373; FR-100).
#
# A member of the workspace root at `rust/Cargo.toml`. Every shared field and
# every shared dependency is inherited rather than restated, so this crate is
# measured by the workspace's gate and cannot drift from it.
#
# `quoin-store` is a hard dependency and not an optional one: FR-100-CON-4
# forbids reimplementing canonical JSON, JCS, sha256 record identity, blake3 or
# atomic replacement anywhere else, so every byte this crate writes goes
# through it.
[package]
name = "quoin-evidence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Quoin's evidence store, producer adapters and trust/independence assessments."
publish.workspace = true

[lints]
workspace = true

[dependencies]
quoin-quire-types = { workspace = true }
quoin-store = { workspace = true }
regex = "=1.13.1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Optional, and enabled by `quoin-schemas` through `quoin-core` rather than by
# this crate: the derives are what let FR-097 read the boundary's TypeScript
# off the types that actually serialise, but nothing on the store's own
# execution path needs them.
schemars = { workspace = true, optional = true }

[features]
# FR-097. Off by default on purpose: a feature that is on by default is a
# feature nobody ever proves works when it is off.
schema = ["dep:schemars", "quoin-quire-types/schema"]

[dev-dependencies]
tempfile = "=3.27.0"
