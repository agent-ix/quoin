[package]
name = "quoin-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The Rust command surface for Quoin."
publish.workspace = true
default-run = "quoin"
build = "build.rs"

[[bin]]
name = "quoin"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { workspace = true }
quoin-core = { workspace = true }
quoin-config = { workspace = true }
quoin-delivery = { workspace = true }
quoin-graph-analysis = { workspace = true }
# `quoin measurement verify` (PLAT-985) reads a plan's document and its
# protected-apparatus digests to check them against git history — the same
# frontmatter parse and types `quoin-measurement` itself uses, rather than a
# second reader of the same documents here.
quoin-measurement = { workspace = true, features = ["campaign"] }
engineering-assurance = { workspace = true, features = ["campaign"] }
# `--digest-from-file` (PLAT-931) computes a `measurement.record` digest from a
# local file with the store's own `digest_file_sha256`, rather than a caller
# pasting a `sha256:<64 hex>` string by hand and this crate trusting its shape.
# `quoin measurement verify` (PLAT-985) also uses it to check a protected
# apparatus file's git-committed bytes against its recorded digest.
quoin-store = { workspace = true }
quoin-yaml = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
semver = { workspace = true }
time = { workspace = true }

[dev-dependencies]
quoin-semantic = { workspace = true }
quoin-validators = { workspace = true }
serde = { workspace = true }
tempfile = { workspace = true }
