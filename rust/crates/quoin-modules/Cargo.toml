[package]
name = "quoin-modules"
description = "Quoin's spec-module install registry, git-backed sources and default-set reconciliation (Rust port, quoin#381)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Not declared at the root: pinned exactly here, for the same reason the root
# pins exactly — the gate is a claim about these bytes, not about whatever
# resolved this morning.
#
# Blocking client on purpose — see `src/git.rs`. rustls rather than the system
# curl/openssl so a module install does not depend on ambient TLS libraries.
gix = { version = "=0.87.1", features = [
    "blocking-network-client",
    "blocking-http-transport-reqwest-rust-tls",
    "revision",
] }
serde_yaml_ng = "=0.10.0"
schemars = { workspace = true, optional = true }

[features]
# FR-097. `quoin-core` turns this on so `quoin-schemas` can read the wire shape
# of a registry record off `InstalledModule` itself. The alternative — a second
# declaration of the same record inside `quoin-core` — is exactly the duplicate
# FR-097 exists to remove. No `default`: a feature that is on by default is a
# feature nobody ever proves works when it is off.
schema = ["dep:schemars"]

[dev-dependencies]
tempfile = "=3.27.0"
