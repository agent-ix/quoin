[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
quire-canonical = { workspace = true }

# Unix only: the Windows release target has neither flag, and takes its own
# path in `read_regular_file_bounded`. Already resolves once in the graph (aws-lc-sys's
# build dependency), so depending on it directly adds no second version. Needed for
# `O_NOFOLLOW`/`O_NONBLOCK` on the open call `read_regular_file_bounded` makes: std
# exposes neither flag constant, and `OpenOptionsExt::custom_flags` needs one to
# pass (PLAT-985, quoin#600 review — the resolver's stat-then-read race).
[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[dev-dependencies]
ix-trace-rs = { workspace = true }
# Exercise the shared Value adapter under both serde_json map feature sets.
serde_json = { workspace = true }
