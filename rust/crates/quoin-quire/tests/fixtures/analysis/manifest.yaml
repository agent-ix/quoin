# A minimal module for the analysis counting tests (FR-153, FR-184): one
# criterion table with a declared method, obligations derived from it.
name: quoin-quire-analysis-fixture
version: 0.1.0
description: Fixture module for the analysis result counting tests
artifact_types:
  - name: FR
    grammar_ref: iso-spec-core
    defaults:
      id_pattern: FR-{next:03d}
  - name: TestMatrix
    defaults:
      id_pattern: TM-{next:03d}
traceability:
  trace_targets:
    - name: acceptance-criterion
      archetype: FR
      section: Acceptance Criteria
      id_column: ID
    - name: test-case
      archetype: TestMatrix
      section: Test Cases
      id_column: ID
  document_references:
    - name: verification
      archetype: FR
      section: Acceptance Criteria
      column: Verification
      row_id_column: ID
      pattern: '\((TC-\d+)\)'
      targets: [test-case]
  obligations:
    - name: acceptance-criterion
      target: acceptance-criterion
      statement_column: Criteria
      method_column: Verification
  trace_tags:
    markers:
      - name: rust-trace-attribute
        language: rust
        pattern: '#\[trace\(([^)]*)\)\]'
        template: "#[trace({ids})]"
