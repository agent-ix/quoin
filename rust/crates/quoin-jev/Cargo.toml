[package]
name = "quoin-jev"
description = "The criterion-strength lens's Jev (typesafe.ai System One) client wiring (PLAT-837)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "quoin_jev"
path = "src/lib.rs"

[lints]
workspace = true

[features]
# Off by default, and must stay off: `make rust-gate` runs unattended and the
# crate invariant in `lib.rs` is that no test in the default path opens a
# socket or reads the real `TYPESAFE_API_KEY`. Turning this on runs
# `tests/live_criterion_strength.rs`, which spends real tokens against
# `api.typesafe.ai` (PLAT-917).
live-api = []

[dependencies]
quoin-modules = { workspace = true }
# The cassette's request key (PLAT-977) hashes the canonical bytes of
# `{state, questions}` through this crate's own `digest_canonical_value`
# rather than a second, hand-rolled canonicalizer -- quoin already has exactly
# one fact called "the canonical hash of a JSON value" and this reuses it.
quoin-store = { workspace = true }
# `corpus_check`'s "N of M" prose scan (PLAT-933) -- already a workspace
# dependency (see the pin's own comment in the root `Cargo.toml`), so this
# adds a direct edge and no new version.
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# `cassette::Cassette` (PLAT-977) holds its record-mode cache lock across the
# delegate's `.await`, so two concurrent requests for one key cannot both call
# the live API and both append a line -- that needs an async-aware mutex. Only
# the `sync` feature: no runtime is built here (see `lib.rs`). Same pin as the
# dev-dependency below and as the version already resolved through `reqwest`.
tokio = { version = "=1.48.0", default-features = false, features = ["sync"] }
# The cassette (PLAT-977) is a `typesafe_sdk_http::Transport` implementation,
# and that trait is itself declared with `#[async_trait]` -- an implementer
# needs the same macro to produce a matching `dyn`-compatible shape. Pinned to
# 0.1.92, already resolved transitively through `typesafe-sdk-http` (see
# `Cargo.lock`), so this adds a direct edge and no new version.
async-trait = "=0.1.92"
typesafe-sdk-answers = "=0.6.2"
typesafe-sdk-client = "=0.6.2"
typesafe-sdk-config = "=0.6.2"
typesafe-sdk-env = "=0.6.2"
typesafe-sdk-error = "=0.6.2"
typesafe-sdk-http = "=0.6.2"
typesafe-sdk-questions = "=0.6.2"
# `cassette::Cassette::send` (PLAT-977) builds a `Headers::new()` for every
# replayed response, in production code -- promoted here from the
# error-classification tests that used to be its only caller.
typesafe-sdk-headers = "=0.6.2"

[dev-dependencies]
# Only for `#[tokio::test]` driving this crate's own async functions in the
# integration suite; no production code in this crate builds a runtime (see
# `lib.rs`'s module doc: the async/blocking bridge is a future CLI caller's
# concern, not this library's).
tokio = { version = "=1.48.0", default-features = false, features = ["rt", "macros"] }
tempfile = { workspace = true }
