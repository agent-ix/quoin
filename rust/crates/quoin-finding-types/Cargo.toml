[package]
name = "quoin-finding-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The auditor's findings, severities and report envelope."
publish.workspace = true

[lib]
name = "quoin_finding_types"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
quoin-evidence = { workspace = true }
serde = { workspace = true }
# `#[serde(flatten)]` needs a real value type for the members this crate carries
# and does not declare; `serde_json` moved from dev-dependencies for that
# (quoin#385).
serde_json = { workspace = true }
# FR-097. Optional, and turned on by `quoin-schemas` rather than here: the wire
# shapes `auditor.audit` answers with are these types, and a schema nobody
# generates is a contract nobody checks.
schemars = { workspace = true, optional = true }

[features]
# FR-097. Off by default on purpose: a feature that is on by default is a
# feature nobody ever proves works when it is off.
schema = ["dep:schemars", "quoin-evidence/schema"]
