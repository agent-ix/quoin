[package]
name = "quoin-measurement"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Measurement plans, collections, assurance profiles, raw-evidence accounting, intervention experiments and operational control evidence (quoin FR-100)."
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The owner of a `MeasurementPlan`'s `objective` block — its `Direction` and
# validated `Objective` (engineering-assurance FR-020, PLAT-957). Plan intake
# parses the block into EA's type rather than a local mirror of it. Only the
# `measurement` feature: `full` enables `serde_json/arbitrary_precision`, which
# feature unification would impose on every crate in this workspace.
# `claim-strength` added by PLAT-972: intervention-experiment and
# operational-evidence records each carry one EA `ClaimStrength` (PLAT-971)
# rather than a local mirror enum.
engineering-assurance = { workspace = true, features = ["measurement", "claim-strength"] }
# The ONLY place canonical JSON, strict JSON parsing, sha256 file digests and
# durable store writes come from. FR-100-CON-4 forbids a second implementation
# and `tc_468_boundary` asserts over this crate's own sources that there is not
# one here. In particular: this crate has no `sha2` dependency, because the one
# sha256 it needs is `quoin_store::digest_file_sha256`.
# The FR-042 refusal boundary for `cli-agent-evals` reports. The agent-eval
# producer names that adapter rather than re-deciding what the format is
# (`agent-eval-intervention.ts:21-27`).
quoin-evidence = { workspace = true }
# The one JSON Schema validator, carrying the vendored
# `intervention-experiment.v1` and `operational-evidence.v1` documents
# (quoin#470). This crate carries no second copy of either schema and compiles
# neither itself.
quoin-jsonschema = { workspace = true }
quoin-store = { workspace = true }
# The one YAML reader on the quoin boundary (quoin#378/#404). MeasurementPlan
# and AssuranceProfile frontmatter are read with it; nothing else here parses
# YAML.
quoin-yaml = { workspace = true }
serde = { workspace = true }
# The record types carry three open JSON shapes the schema does not close —
# `configuration`, `held_constant[].value` and the exercise's
# `state_before`/`state_after` (`intervention-types.ts:8,52`,
# `operational-types.ts:82,83`). They are carried as `serde_json::Value` so a
# round trip through this crate returns the bytes it was handed.
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Property tests over the verdict checker's estimator recomputation
# (PLAT-961); the workspace pin.
proptest = { workspace = true }
tempfile = "=3.27.0"
