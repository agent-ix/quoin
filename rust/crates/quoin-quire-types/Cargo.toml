[package]
name = "quoin-quire-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Deserialize-only readers for quire's wire formats. Quire owns these formats; this crate only reads them."
publish.workspace = true

[lib]
name = "quoin_quire_types"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }

# Optional, and enabled by `quoin-schemas` rather than by this crate: the
# derives are what let the SCHEMA be read off the canonical type, but nothing
# on the boundary's own execution path needs them, so the shipped binary does
# not carry the generator's dependency tree.
schemars = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
sha2 = { workspace = true }

[features]
# FR-097. `quoin-schemas` turns this on to read the wire shapes off the types
# that actually deserialise them. No `default`: a feature that is on by default
# is a feature nobody ever proves works when it is off.
schema = ["dep:schemars"]
