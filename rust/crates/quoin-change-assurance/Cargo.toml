[package]
name = "quoin-change-assurance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Change-assurance records, proof attestations, verification receipts and the ix-flow decision chain (quoin FR-063/FR-064/FR-065)."
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The ONLY place canonical JSON, JCS, blake3 and durable store writes come
# from. FR-100-CON-4 forbids a second implementation, and `tc_455_boundary`
# asserts over this crate's own sources that there is not one here.
quoin-store = { workspace = true }
# The ix-flow event hash is sha256, and `quoin-store` keeps its own sha256
# helper private. This is that one hash and nothing else: no canonicalization,
# no record digest, no file digest comes from here.
sha2 = { workspace = true }
thiserror = { workspace = true }
# `ProtectedApparatus`, `NegativeControls` and their entry grammar are
# engineering-assurance's (FR-024); `quoin-measurement` already reads a
# `MeasurementPlan`'s copies into these same types (PLAT-975), so this crate
# reuses them rather than restating the entry grammar (PLAT-964). Only the
# `measurement` feature's types are used; no JSON, canonicalization or digest
# comes from here (see `tc_455_no_second_canonicalization_or_digest_implementation_exists_here`).
# `claim-strength` added by PLAT-972: a proof attestation carries one of the
# four FR-022 `ClaimStrength` wire names EA declares (PLAT-971) rather than a
# local mirror enum. Neither feature is `full`, which enables
# `serde_json/arbitrary_precision` for every crate in this workspace.
engineering-assurance = { workspace = true, features = ["measurement", "claim-strength"] }

[dev-dependencies]
# `tests/tc_503_schema_assets.rs` validates documents this crate sealed against
# the schema assets this crate owns. The validator and the JSON reader are
# dev-only on purpose: `tests/tc_455_boundary.rs` censuses `src/` to keep both
# out of the library, where a schema check would become a second validator.
quoin-jsonschema = { workspace = true }
serde_json = { workspace = true }
tempfile = "=3.27.0"
