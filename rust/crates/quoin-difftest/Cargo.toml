[package]
name = "quoin-difftest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Dev-only differential harness: the retained TypeScript and quoin-core, one request, one verdict."
publish.workspace = true

[[bin]]
name = "quoin-difftest"
path = "src/main.rs"

# The disk side of the snapshot differential (quoin#412, review FND-001). A
# dev-only probe in the dev-only crate: `quoin validate` analyses a repository
# through `src/core/snapshot.ts` -> `MemoryRepo`, and this answers the same
# question over `DiskRepo` for the same tree so the two can be compared. It
# cannot live in `quoin-core`, whose library half is audited to name no host
# capability.
[[bin]]
name = "quoin-disk-findings"
path = "src/bin/disk_findings.rs"

[lints]
workspace = true

[dependencies]
quoin-core = { workspace = true }
quoin-validators = { workspace = true }
serde_json = { workspace = true }
