[package]
name = "quoin-completeness"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
description = "Declared-vocabulary completeness and its verdict policy (quoin FR-037, ADR-0011)."
license = "AGPL-3.0-or-later"
repository = "https://github.com/agent-ix/quoin"
publish = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
module_name_repetitions = "allow"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# YAML 1.1 (libyaml) reader for `manifest.yaml` and document frontmatter. The
# TypeScript reads YAML 1.2 via the `yaml` npm package; see
# ../quoin-semantic/DIVERGENCE.md §6 for where the two disagree.
serde_norway = "0.9"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
