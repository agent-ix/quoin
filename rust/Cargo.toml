# SPDX-License-Identifier: AGPL-3.0-or-later
# Copyright (C) 2026 Agent-IX
#
# The Rust workspace for the quoin burn-down (quoin#373, Stage 0 = quoin#375).
#
# It lives INSIDE the quoin repository, beside the retained `src/`, because
# FR-101 requires old and new implementations to be exercised at ONE candidate
# revision. A second repository would turn that into a two-repo pin-and-sync
# problem, which is the failure this arrangement exists to avoid.
#
# Only three crates exist today, and that is deliberate: an empty crate is
# noise, not a plan. The topology in #373 is realised one stage at a time.

[workspace]
resolver = "3"
members = ["crates/*"]

# The lint policy lives HERE rather than only in CI flags, so `cargo clippy`
# on a developer machine enforces the same thing the gate does. Every crate
# opts in with `[lints] workspace = true`; there is no exception, and adding
# one needs a written reason in this file.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# The panic surface of a binary that reads untrusted JSON off stdin. These are
# `warn` here and fatal in the gate (`-D warnings`), so a local build shows
# them all rather than stopping at the first.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
# Every `as` cast crossing the wire boundary must be a `try_from`.
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"

[workspace.package]
version = "0.25.0"
edition = "2024"
rust-version = "1.98.1"
license = "AGPL-3.0-or-later"
repository = "https://github.com/agent-ix/quoin"
authors = ["Agent-IX"]
# Every crate in this workspace is unpublished; `publish.workspace = true` in
# each manifest inherits it rather than restating it.
publish = false

# Exact pins, matching quire-corpus. A caret range makes the gate a claim about
# whatever resolved that morning; `=` makes it a claim about these bytes.
#
# One deliberate divergence: `serde` is one patch ahead of quire-corpus, which
# pins `=1.0.228`. `schemars = "=1.2.2"` pulls `syn 3.x` through
# `schemars_derive` and `ref-cast-impl`, while `serde_derive 1.0.228` pulls
# `syn 2.x`. Both paths are ours, so the duplicate was ours to resolve rather
# than skip, and `serde 1.0.229` moves `serde_derive` off the `syn 2.x` side.
# quire-corpus has no `schemars` dependency, so it does not have this duplicate
# and is not wrong today; it should follow when it next revises its pins.
#
# `thiserror` diverges from quire-corpus's `=2.0.18` for the same reason and in
# the same direction: `thiserror 2.0.20` uses `syn 3.x`. quoin#378 raised it
# independently, for an unrelated reason — `saphyr`, the YAML 1.2 reader
# quoin-yaml wraps, requires ^2.0.20 — and the two branches converged on the
# same value.
#
# Together these three pins — `serde 1.0.229`, `thiserror 2.0.20`,
# `schemars 1.2.2` — put every root pin we own on `syn 3.0.5`, which is the
# premise the `syn@2.0.119` skip in `deny.toml` rests on. Revert any of them
# and the premise is gone and that skip is hiding a duplicate we could resolve.
# (What is left on the `syn 2.x` side is third-party macro subtrees only: gix's
# own pins, both `jsonschema` majors, `jni` and `jiff`. The entry's `reason`
# lists every path. This was re-measured after quoin-quire, quoin-semantic and
# quoin-store merged, not inherited from when the branch was cut.)
[workspace.dependencies]
quoin-assurance = { path = "crates/quoin-assurance" }
quoin-change-assurance = { path = "crates/quoin-change-assurance" }
quoin-catalog = { path = "crates/quoin-catalog" }
quoin-cli = { path = "crates/quoin-cli" }
quoin-combinatorial = { path = "crates/quoin-combinatorial" }
quoin-completeness = { path = "crates/quoin-completeness" }
quoin-auditor = { path = "crates/quoin-auditor" }
quoin-config = { path = "crates/quoin-config" }
quoin-core = { path = "crates/quoin-core" }
quoin-delivery = { path = "crates/quoin-delivery" }
quoin-evidence = { path = "crates/quoin-evidence" }
quoin-evidence-types = { path = "crates/quoin-evidence-types" }
quoin-finding-types = { path = "crates/quoin-finding-types" }
quoin-graph-analysis = { path = "crates/quoin-graph-analysis" }
quoin-jev = { path = "crates/quoin-jev" }
quoin-jsonschema = { path = "crates/quoin-jsonschema" }
quoin-measurement = { path = "crates/quoin-measurement" }
quoin-measurement-graph = { path = "crates/quoin-measurement-graph" }
quoin-modules = { path = "crates/quoin-modules" }
quoin-quire = { path = "crates/quoin-quire" }
quoin-quire-types = { path = "crates/quoin-quire-types" }
quoin-semantic = { path = "crates/quoin-semantic" }
quoin-store = { path = "crates/quoin-store" }
quoin-validators = { path = "crates/quoin-validators" }
quoin-yaml = { path = "crates/quoin-yaml" }
# Raised from =1.0.228 by quoin#378: `serde_derive` 1.0.228 builds on `syn` 2
# while `thiserror-impl` 2.0.20 builds on `syn` 3, and `multiple-versions =
# "deny"` forbids carrying both. 1.0.229 moves `serde_derive` to `syn` 3, which
# resolves the half of that duplicate we own. See the `syn` entry in
# `deny.toml`'s `[bans] skip` for the half we do not. `engineering-assurance`
# 0.3.1 (on main) requires exactly 1.0.229, so the two sides already agree.
serde = { version = "=1.0.229", features = ["derive"] }
# FR-097: the JSON Schema the generated TypeScript surface is derived from.
# Exact pin for the same reason as every other line here — the generated file
# is hash-asserted, so the generator's version is part of the contract and a
# caret range would let a patch release silently move the digest.
#
# 1.2.2 AND NOT 1.2.1, and the difference is `multiple-versions = "deny"`
# rather than taste. `schemars_derive` 1.2.2 is on `syn` 3, which is where
# `serde_derive` 1.0.229 also is; 1.2.1 is on `syn` 2 and would put two `syn`
# majors in the graph, which `cargo deny` refuses — correctly. `ref-cast` is
# at 1.0.27 for the same reason.
schemars = { version = "=1.2.2", features = ["derive"] }
# Raised from =1.0.150 (this branch) to =1.0.151 (main) on merge: main's pin is
# the higher of the two and a pin moves UP, never down. Nothing on this branch
# requires 1.0.150 specifically; it was simply the latest when the branch was
# cut.
serde_json = "=1.0.151"
time = { version = "=0.3.55", features = ["formatting"] }
# The digest under the FR-097 hash assertion. Exact pin like everything else.
#
# 0.10.9 AND NOT 0.11.0, and the reason is an upstream requirement rather than
# taste: `quire-rs 0.46.0` — linked by quoin-quire — depends on sha2 0.10.9,
# and `multiple-versions = "deny"` forbids carrying both majors. quoin#380
# (quoin-store) arrived pinning sha2 at =0.11.0 in its own manifest, which is
# a duplicate git does not mark because the two pins live in different files;
# quoin-store now takes this pin instead. Nothing that has landed moved: this
# line is unchanged, and the unlanded pin converged onto it. Raising the
# workspace to 0.11.0 would not resolve the duplicate, only swap which side of
# it we own — verified with `cargo tree -i sha2@0.10.9`, whose only path is
# `quire-rs <- quoin-quire`. Nothing is lost by converging here: SHA-256 is
# SHA-256, and 0.11.0 changes the `digest` trait crate beneath it, not the
# bytes it produces. When quire-rs advances, this pin moves up with it.
sha2 = "=0.10.9"
# Raised from =2.0.18 by quoin#378: `saphyr` (the YAML 1.2 core-schema reader
# quoin-yaml wraps) requires ^2.0.20, and `multiple-versions = "deny"` in
# deny.toml forbids carrying both. `feat/381-config-modules` raises this pin to
# the same =2.0.20 independently, for an unrelated reason — the two branches
# converge here; whoever merges second should not read it as drift.
thiserror = "=2.0.20"
# The regex engine the advisor's ~60-entry characteristic table is written
# against (quoin#383) and the three the combinatorial parser uses (quoin#382).
# Already in the graph transitively, so this pin adds a direct edge and no new
# version: `cargo tree -i regex` reaches it through `jsonschema`. Exact pin for
# the reason every line here is exact.
regex = "=1.13.1"
# Property testing for the covering-array invariants (quoin#382 acceptance).
# The workspace had no property-testing dependency before this; quoin#446
# restated a fast-check property as a bounded exhaustive loop and said so,
# because that cutover was not the place to add one. quoin#382 names proptest
# in its acceptance criterion, so this is the place.
proptest = { version = "=1.9.0", default-features = false, features = ["std", "bit-set"] }
jsonschema = { version = "=0.56.0", default-features = false }
engineering-assurance = { version = "=0.4.0", git = "https://github.com/agent-ix/engineering-assurance", rev = "438b30fcd5d4df457fe0fca4682b322c72856c1c", default-features = false }
clap = { version = "=4.5.47", default-features = false, features = ["std", "help", "usage", "error-context"] }
flate2 = "=1.1.10"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls"] }
semver = "=1.0.28"
tar = "=0.4.46"
tempfile = "=3.27.0"
url = "=2.5.8"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
