#
# The MSRV clippy checks lint suggestions against. Must equal the channel in
# rust-toolchain.toml and the `rust-version` in [workspace.package]: a lower
# value here silently suppresses suggestions this workspace could take.
msrv = "1.98.1"

# `quoin-core` reads a request off stdin. Anything it accumulates from an
# untrusted stream needs a ceiling, so the large-* thresholds are set rather
# than left at clippy's defaults.
too-many-arguments-threshold = 6
