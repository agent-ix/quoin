[package]
name = "quoin-config"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
description = "Quoin's persistent configuration, plugin-schema registration and authoring-organization resolution (Rust port, quoin#381)."
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
